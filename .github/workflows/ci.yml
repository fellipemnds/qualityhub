name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    verificar:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npx prisma generate
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:cobertura
            - name: Cobertura das linhas novas (CONSTRAINTS §2)
              if: github.event_name == 'pull_request'
              env:
                DESTINO: ${{ github.base_ref }}
              run: pipx run diff-cover==10.6.0 coverage/cobertura-coverage.xml --compare-branch="origin/$DESTINO" --fail-under=100 --exclude src/criar-admin.ts
    segredos:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: gitleaks (CONSTRAINTS §2; exceções no .gitleaksignore)
              # O hash é o do gitleaks_8.30.1_checksums.txt da release: ao trocar a versão, trocar os dois
              run: |
                curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
                tar xzf gitleaks.tar.gz gitleaks
                ./gitleaks detect --redact --no-banner --report-format json --report-path gitleaks.json
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                name: gitleaks
                path: gitleaks.json

    sast:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Semgrep (CONSTRAINTS §2; exceções no .semgrepignore)
              run: pipx run semgrep==1.179.0 scan --config p/default --config p/owasp-top-ten --metrics=off --quiet --severity ERROR --error --sarif-output=semgrep.sarif
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                name: semgrep
                path: semgrep.sarif

    dependencias:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: osv-scanner (CONSTRAINTS §2; exceções no osv-scanner.toml)
              # O hash é o do osv-scanner_SHA256SUMS da release: ao trocar a versão, trocar os dois
              run: |
                curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
                echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
                chmod +x osv-scanner
                ./osv-scanner scan source -r .
