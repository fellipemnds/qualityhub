            </div>
        </main>`;
    }
    function entrar() {
        E.usuario = E.perfilEscolhido;
        E.historico = [];
        Object.assign(E, { tela: telaInicial(), ncId: null, itemId: null, aba: "resumo", filtro: "Todas", termo: "", gavetas: {}, folha: null });
        desenhar(true);
        avisar(`Você entrou como ${nomeDe(E.usuario)}.`);
    }

    // ─── T-03 Minhas pendências (a porta: a única tela do app com a luz) ─────────────
    function apoioUrgente(p) {
        const r = R(p.id);
        if (!r || p.mencao) return p.sub;
        return r.tipo === "NC" ? r.campos.titulo || p.sub : `${textoDe(r)} · ${r.nc}`;
    }
    const ORDEM_URGENCIA = ["aprovar", "corrigir", "executar", "verificar", "fechamento", "triagem", "mencoes", "rascunhos"];
    function telaPendencias() {
        const lista = pendencias();
        const vencidas = lista.filter((p) => p.prazo && diasAte(p.prazo) < 0);
        const ordenadas = [...vencidas.sort((a, b) => diasAte(a.prazo) - diasAte(b.prazo)), ...lista.filter((p) => !vencidas.includes(p)).sort((a, b) => ORDEM_URGENCIA.indexOf(a.grupo) - ORDEM_URGENCIA.indexOf(b.grupo))];
        const urg = ordenadas[0];
        const g = E.gavetas;
        const linha = (p) => `
            <button class="linha" data-acao="abrir" data-id="${p.id}" ${p.mencao ? 'data-mencao="1"' : ""}>
                <span class="corpo"><span class="titulo">${esc(p.titulo)}</span><span class="t-apoio">${esc(p.sub)}</span>${desk ? "" : p.prazo ? `<span class="t-rotulo">${prazoTag(p.prazo)}</span>` : p.apoio ? `<span class="t-rotulo">${esc(p.apoio)}</span>` : ""}</span>
                ${desk ? `<span class="lado t-apoio">${p.prazo ? prazoTag(p.prazo) : esc(p.apoio || "")}</span>` : ""}
                <span class="chev">${ic("direita")}</span>
            </button>`;
        const gaveta = (id, icone, nome, itens, alerta = false) => `
            <div class="gaveta">
                <button class="gaveta-cab" data-acao="gaveta" data-id="${id}" aria-expanded="${!!g[id]}">
                    ${alerta ? `<span class="alerta">${ic(icone, "g")}</span>` : ic(icone, "g")}
                    <span class="nome">${nome}</span><span class="contador num">${itens.length}</span>${ic(g[id] ? "cima" : "baixo")}
                </button>
                ${g[id] ? itens.map(linha).join("") : ""}
            </div>`;
        const grupos = GRUPOS.filter((x) => x.papeis.some((p) => tem(p)));
        const cheios = grupos.filter((x) => lista.some((p) => p.grupo === x.id && !vencidas.includes(p)));
        const emDia = grupos.filter((x) => !lista.some((p) => p.grupo === x.id)).map((x) => x.nome);
        const nomeAcao = { aprovar: "Aprovar", corrigir: "Corrigir", executar: "Executar ação", verificar: "Verificar", fechamento: "Enviar para fechamento", triagem: "Triagem", mencoes: "Você foi mencionado", rascunhos: "Continuar rascunho" };
        const urgente = urg
            ? `<section class="urgente" aria-label="O mais urgente">
                <div class="topo"><span class="t-rotulo">O mais urgente</span>${urg.prazo ? prazoTag(urg.prazo) : ""}</div>
                <div class="acao">${ic(GRUPOS.find((x) => x.id === urg.grupo).icone)}${esc(nomeAcao[urg.grupo])} · ${esc(urg.titulo.split(" · ")[0])}</div>
                <p class="t-apoio">${esc(apoioUrgente(urg))}</p>
                <button class="btn btn-pri btn-full" data-acao="abrir" data-id="${urg.id}" ${urg.mencao ? 'data-mencao="1"' : ""}>Abrir</button>
            </section>`
            : "";
        const gavetas = lista.length
            ? `<h2 class="t-secao secao-titulo">Para você hoje</h2>
            <div class="gavetas">
                ${vencidas.length ? gaveta("vencidas", "alerta", "Vencidas", vencidas, true) : ""}
                ${cheios.map((x) => gaveta(x.id, x.icone, x.nome, lista.filter((p) => p.grupo === x.id && !vencidas.includes(p)))).join("")}
                ${emDia.length ? `<div class="em-dia">${ic("ok", "g")}<span>${emDia.length > 3 ? `${emDia.slice(0, 2).join(", ")} e mais ${emDia.length - 2} tipos` : emDia.join(", ")}: em dia</span></div>` : ""}
            </div>`
            : `<div class="vazio-dia">${ic("ok", "gg")}<h2 class="t-secao">Você está em dia</h2><p class="t-apoio">Nada espera por você agora.</p><button class="btn btn-sec" data-acao="aba-app" data-tela="ncs">Ver as NCs</button></div>`;
        if (desk) return telaPendenciasPC(lista, ordenadas, vencidas, gavetas);
        return `<main class="porta pad">
            ${BRILHO}
            <div>
                <div>
                    <header class="saudacao">
                        <p class="t-rotulo">${hojePorExtenso()}</p>
                        <h1 class="t-pagina">${saudacaoHora()}, ${esc(primeiro(E.usuario))}</h1>
                        <p class="t-apoio">${lista.length ? `${lista.length} ${lista.length === 1 ? "coisa espera" : "coisas esperam"} por você.${vencidas.length ? ` ${vencidas.length} ${vencidas.length === 1 ? "está vencida" : "estão vencidas"}.` : ""}` : "Tudo em dia."}</p>
                    </header>
                    ${urgente}
                    ${gavetas}
                </div>
            </div>
            <div class="folga-barra"></div>
        </main>${navegacao("pendencias")}`;
    }

    // ─── T-04 Lista de NCs ────────────────────────────────────────────────────────────
    const listaNcs = () =>
        Object.values(E.reg)
            .filter((r) => r.tipo === "NC" && r.estado !== "Rascunho")
            .sort((a, b) => b.codigo.localeCompare(a.codigo));
    const cartaoNc = (nc) => `<button class="cartao" data-acao="abrir" data-id="${nc.id}">
            <span class="l1"><span class="t-apoio num">${nc.codigo} · ${esc(nc.campos.setor)}</span>${pilula(nc.estado)}</span>
            <span class="t-secao">${esc(nc.campos.titulo)}</span>
            ${indicadores(nc).some((i) => i.alerta) ? `<span class="alerta t-apoio">${ic("alerta")}${esc(indicadores(nc).find((i) => i.alerta).texto)}</span>` : ""}
            <span class="l3"><span class="etapa">${etapa(etapaDe(nc))}</span>${avatares(nc.resp.slice(0, 3))}</span>
        </button>`;
    function telaNcs() {
        const termo = E.termo.trim().toLowerCase();
        const todas = listaNcs();
        const lista = todas
            .filter((nc) => (E.filtro === "Minhas" ? colab(nc) : E.filtro === "Vencidas" ? indicadores(nc).some((i) => i.alerta) : true))
            .filter((nc) => !termo || nc.codigo.toLowerCase().includes(termo) || nc.campos.titulo.toLowerCase().includes(termo));
        const abertas = todas.filter((nc) => nc.estado === "Aberta" || nc.estado === "Em aprovação").length;
        const vencidas = todas.filter((nc) => indicadores(nc).some((i) => i.alerta)).length;
        if (desk) return telaNcsPC(lista, todas, abertas, vencidas);
        const corpo = desk
            ? `<div class="tabela-caixa"><table class="tabela">
                <thead><tr><th>Código</th><th>Título</th><th>Estado</th><th>Etapa</th><th>Setor</th><th>Com quem</th><th>Detectada</th></tr></thead>
                <tbody>${lista
                    .map(
                        (nc) => `<tr data-acao="abrir" data-id="${nc.id}" tabindex="0"><td class="num t-apoio">${nc.codigo}</td><td><strong>${esc(nc.campos.titulo)}</strong>${indicadores(nc).some((i) => i.alerta) ? `<br><span class="alerta t-rotulo">${ic("alerta")}${esc(indicadores(nc).find((i) => i.alerta).texto)}</span>` : ""}</td><td>${pilula(nc.estado)}</td><td class="t-apoio">${etapa(etapaDe(nc))}</td><td>${esc(nc.campos.setor)}</td><td>${avatares(nc.resp.slice(0, 3))}</td><td class="num t-apoio">${br(nc.campos.detectada)}</td></tr>`,
                    )
                    .join("")}</tbody></table>${lista.length ? "" : '<p class="cartao t-apoio">Nenhuma NC com esse código ou título.</p>'}</div>`
            : `<div class="cartoes">${lista.map(cartaoNc).join("") || '<p class="cartao t-apoio">Nenhuma NC com esse código ou título.</p>'}</div>`;
        return `<header class="barra-sup pad"><h1 class="t">Não Conformidades</h1>${pode("criarNC") ? `<button class="btn btn-pri btn-barra" data-acao="nova">${ic("criar")}Nova NC</button>` : ""}</header>
        <main class="pad conteudo-larg">
            <div class="resumo-lista t-apoio"><span class="num">${abertas} abertas</span>${vencidas ? `<span class="alerta">${ic("alerta")}${vencidas} com prazo vencido</span>` : ""}</div>
            <label class="busca">${ic("busca")}<span class="sr">Buscar por código ou título</span><input id="busca-ncs" type="search" placeholder="Código ou título" value="${esc(E.termo)}" autocomplete="off"></label>
            <div class="segmentado" role="group" aria-label="Quais NCs">
                ${["Todas", "Minhas", "Vencidas"].map((f) => `<button data-acao="filtro" data-id="${f}" aria-pressed="${E.filtro === f}">${f}</button>`).join("")}
            </div>
            <div class="chips">${["Etapa", "Estado", "Setor", "Origem", "Classificação"].map((c) => `<button class="chip" data-acao="fora">${c}${ic("baixo")}</button>`).join("")}</div>
            ${corpo}
            <p class="rodape-lista t-apoio num">Mostrando ${lista.length} de ${todas.length}</p>
            <div class="folga-barra"></div>
        </main>${navegacao("ncs")}`;
    }

    // ─── T-05 Nova NC (e o rascunho dela) ─────────────────────────────────────────────
    const SETORES_ATIVOS = () => E.setores.filter((s) => s.ativo).map((s) => s.nome);
    function telaNova() {
        const f = E.form || {};
        const er = E.erros;
        const campo = (id, rotulo, html, ajuda) => `
            <div class="campo ${er[id] ? "erro" : ""}">
                <label for="f-${id}">${rotulo}</label>
                ${html}
                ${er[id] || ajuda ? `<span class="ajuda" id="a-${id}">${esc(er[id] || ajuda)}</span>` : ""}
            </div>`;
        const desc = (id) => (er[id] ? `aria-invalid="true" aria-describedby="a-${id}"` : `aria-describedby="a-${id}"`);
        const opcoes = (lista, val) => `<option value="">Escolha</option>${lista.map((o) => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}`;
        const resp = f.resp || [E.usuario];
        if (desk) {
            const formPC = `<form class="form" id="form-nova" novalidate>
                <div class="grupo"><h2 class="t-secao">O que aconteceu</h2>
                    ${campo("titulo", "Título", `<input id="f-titulo" name="titulo" maxlength="200" placeholder="Ex.: Vazamento na linha 3" value="${esc(f.titulo)}" ${desc("titulo")}>`, "Pelo menos 5 caracteres")}
                    ${campo("descricao", "Descrição", `<textarea id="f-descricao" name="descricao" placeholder="O que aconteceu, onde e quando" ${desc("descricao")}>${esc(f.descricao)}</textarea>`, "Pelo menos 20 caracteres: o que aconteceu, onde e quando")}
                    <div class="grade-2">${campo("detectada", "Detectada em", `<input id="f-detectada" name="detectada" type="date" value="${esc(f.detectada || hojeIso())}" max="${hojeIso()}" ${desc("detectada")}>`, "")}${campo("origem", "Origem", `<select id="f-origem" name="origem" ${desc("origem")}>${opcoes(ORIGENS, f.origem)}</select>`, "")}</div></div>
                <div class="grupo"><h2 class="t-secao">Onde</h2>
                    <div class="grade-2">${campo("setor", "Setor", `<select id="f-setor" name="setor" ${desc("setor")}>${opcoes(SETORES_ATIVOS(), f.setor)}</select>`, "")}${campo("processo", "Processo afetado", `<input id="f-processo" name="processo" placeholder="Ex.: Montagem do cabeçote" value="${esc(f.processo)}" ${desc("processo")}>`, "")}</div>
                    ${campo("cliente", "Cliente (opcional)", `<input id="f-cliente" name="cliente" placeholder="Nome do cliente" value="${esc(f.cliente)}">`, "")}</div>
                <div class="grupo"><h2 class="t-secao">O que foi violado</h2>
                    ${campo("requisito", "Requisito violado", `<input id="f-requisito" name="requisito" placeholder="Ex.: IT-042, item 5.3" value="${esc(f.requisito)}" ${desc("requisito")}>`, "")}</div>
            </form>`;
            const anexosPC = `<label class="anexo area">${ic("upload", "g")}<span>Arraste fotos ou PDF aqui</span><span class="t-rotulo">ou clique para escolher · JPEG, PNG, WebP ou PDF, até 10 MB</span><input id="f-anexo" type="file" accept="image/*,application/pdf" multiple></label><p class="anexos-lista" id="anexos-lista">${(f.anexos || []).map((a) => esc(a[0])).join(" · ")}</p>`;
            return telaNovaPC(formPC, resp.map((s) => `<div class="pessoa">${av(s, "m")}${esc(voce(s))}</div>`).join(""), anexosPC);
        }
        return `<header class="barra-sup pad"><button class="alvo" data-acao="fechar-nova" aria-label="Fechar">${ic("x", "gg")}</button><span class="t">${f.editId ? "Rascunho" : "Nova NC"}</span>
            ${desk ? `<button class="btn btn-sec btn-barra" data-acao="salvar-rascunho">Salvar rascunho</button><button class="btn btn-pri btn-barra" data-acao="publicar" ${E.publicando ? "disabled" : ""}>${E.publicando ? "Publicando…" : "Publicar"}</button>` : ""}</header>
        <main class="pad conteudo-form">
            <form class="form" id="form-nova" novalidate>
                <div class="grupo">
                    <h2 class="t-secao">O que aconteceu</h2>
                    ${campo("titulo", "Título", `<input id="f-titulo" name="titulo" maxlength="200" placeholder="Ex.: Vazamento na linha 3" value="${esc(f.titulo)}" ${desc("titulo")}>`, "Pelo menos 5 caracteres")}
                    ${campo("descricao", "Descrição", `<textarea id="f-descricao" name="descricao" placeholder="O que aconteceu, onde e quando" ${desc("descricao")}>${esc(f.descricao)}</textarea>`, "Pelo menos 20 caracteres: o que aconteceu, onde e quando")}
                    ${campo("detectada", "Detectada em", `<input id="f-detectada" name="detectada" type="date" value="${esc(f.detectada || hojeIso())}" max="${hojeIso()}" ${desc("detectada")}>`, "")}
                    ${campo("origem", "Origem", `<select id="f-origem" name="origem" ${desc("origem")}>${opcoes(ORIGENS, f.origem)}</select>`, "")}
                </div>
                <div class="grupo">
                    <h2 class="t-secao">Onde</h2>
                    ${campo("setor", "Setor", `<select id="f-setor" name="setor" ${desc("setor")}>${opcoes(SETORES_ATIVOS(), f.setor)}</select>`, "")}
                    ${campo("processo", "Processo afetado", `<input id="f-processo" name="processo" placeholder="Ex.: Montagem do cabeçote" value="${esc(f.processo)}" ${desc("processo")}>`, "")}
                    ${campo("cliente", "Cliente (opcional)", `<input id="f-cliente" name="cliente" placeholder="Nome do cliente" value="${esc(f.cliente)}">`, "")}
                </div>
                <div class="grupo">
                    <h2 class="t-secao">O que foi violado</h2>
                    ${campo("requisito", "Requisito violado", `<input id="f-requisito" name="requisito" placeholder="Ex.: IT-042, item 5.3" value="${esc(f.requisito)}" ${desc("requisito")}>`, "")}
                    <div class="responsaveis">
                        <h3 class="t-secao">Responsáveis</h3>
                        <p class="t-apoio">Quem vai trabalhar na NC. Você entra como responsável.</p>
                        ${resp.map((s) => `<div class="pessoa">${av(s, "m")}${esc(voce(s))}</div>`).join("")}
                        <button type="button" class="link" style="justify-self:start" data-acao="pessoas-form">+ Adicionar responsável</button>
                    </div>
                    <label class="anexo">${ic("camera", "g")}<span>Tirar foto ou anexar</span><input id="f-anexo" type="file" accept="image/*,application/pdf" multiple></label>
                    <p class="anexos-lista" id="anexos-lista">${(f.anexos || []).map((a) => esc(a[0])).join(" · ")}</p>
                </div>
            </form>
            <div class="folga-acoes"></div>
        </main>
        ${desk ? "" : `<div class="barra-acoes">
            <button class="btn btn-sec" data-acao="salvar-rascunho" ${E.publicando ? "disabled" : ""}>Salvar rascunho</button>
            <button class="btn btn-pri" data-acao="publicar" ${E.publicando ? "disabled" : ""}>${E.publicando ? "Publicando…" : "Publicar"}</button>
        </div>`}`;
    }
    const CAMPOS_NC = ["titulo", "descricao", "detectada", "origem", "setor", "processo", "cliente", "requisito"];
    function lerForm() {
        const el = document.getElementById("form-nova");
        if (!el) return E.form || {};
        const fd = new FormData(el);
        const f = Object.fromEntries(CAMPOS_NC.map((k) => [k, (fd.get(k) || "").toString()]));
        return { ...E.form, ...f };
    }
    const temConteudo = (f) => ["titulo", "descricao", "origem", "setor", "processo", "cliente", "requisito"].some((k) => f[k]?.trim());
    function validarNC(f) {
        const er = {};
        if ((f.titulo || "").trim().length < 5) er.titulo = "Use 5 caracteres ou mais.";
        if ((f.descricao || "").trim().length < 20) er.descricao = "Use 20 caracteres ou mais: o que aconteceu, onde e quando.";
        if (!f.detectada) er.detectada = "Diga quando foi detectada.";
        if (!f.origem) er.origem = "Escolha a origem.";
        if (!f.setor) er.setor = "Escolha o setor.";
        if (!(f.processo || "").trim()) er.processo = "Diga o processo afetado.";
        if (!(f.requisito || "").trim()) er.requisito = "Diga o requisito violado.";
        return er;
    }
    // o rascunho da NC é um registro como os outros, em Rascunho e sem código
    function guardarRascunhoNC(f) {
        const campos = Object.fromEntries(CAMPOS_NC.map((k) => [k, f[k] || ""]));
        if (f.editId && R(f.editId)) {
            Object.assign(R(f.editId).campos, campos);
            R(f.editId).resp = f.resp || R(f.editId).resp;
            R(f.editId).anexos = f.anexos || R(f.editId).anexos;
            return f.editId;
        }
        const id = `R${E.seq.R++}`;
        E.reg[id] = { id, codigo: null, tipo: "NC", nc: null, estado: "Rascunho", resp: f.resp || [E.usuario], aprovador: null, criadoEm: Date.now(), campos, anexos: f.anexos || [] };
        return id;
    }
    function publicarNC() {
        const f = lerForm();
        E.form = f;
        E.erros = validarNC(f);
        const primeiroErro = Object.keys(E.erros)[0];
        if (primeiroErro) {
            desenhar();
            document.getElementById(`f-${primeiroErro}`)?.focus();
            return;
        }
        E.publicando = true;
        desenhar();
        setTimeout(() => {
            const id = publicarItem(R(guardarRascunhoNC(f)));
            Object.assign(E, { form: null, erros: {}, publicando: false });
            E.historico = [{ tela: "ncs" }];
            Object.assign(E, { tela: "nc", ncId: id, itemId: null, aba: "resumo" });
            desenhar(true);
            avisar(`${id} publicada. Ela aguarda a triagem e a classificação da qualidade.`);
        }, 600);
    }
    // ─── T-06 Detalhe da NC ───────────────────────────────────────────────────────────
    const segmentos = (feitos, total) => `<span class="progresso" aria-hidden="true">${Array.from({ length: total }, (_, i) => `<i class="${i < feitos ? "ok" : ""}"></i>`).join("")}</span>`;
    const linhaDado = (k, v, html = false) => `<div class="dado"><span class="k">${k}</span><span class="v">${html ? v : esc(v || "—")}</span></div>`;
    const funcaoTag = (f) => `<span class="${f === "Aprovador" ? "tag forte" : "tag"}">${f}</span>`;

    function cartaoChecklist(nc) {
        const ch = checklist(nc);
        const ok = ch.filter((x) => x.ok).length;
        return `<section class="cartao-s"><h2 class="t-secao">Checklist de fechamento</h2>
            <div class="progresso-linha">${segmentos(ok, ch.length)}<span class="t-apoio">·</span><span class="t-apoio num">${ok} de ${ch.length} atendidos</span></div>
            <div class="linhas">${ch
                .map((x) =>
                    x.ok
                        ? `<div class="check">${ic("ok", "g")}<span class="txt">${esc(x.feito)}</span></div>`
                        : `<button class="check" data-acao="ir-aba" data-id="${x.ir}">${ic("pendente", "g")}<span class="txt">${esc(x.falta)}</span><span class="chev">${ic("direita")}</span></button>`,
                )
                .join("")}</div></section>`;
    }
    function cartaoDados(nc) {
        const c = nc.campos;
        const cl = filhosDe(nc.id, "CL").filter((r) => r.estado === "Fechada").sort((a, b) => b.fechadoEm - a.fechadoEm)[0];
        return `<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Dados</h2>${pode("editar", nc) ? '<button class="link-sec" data-acao="fora">Editar</button>' : ""}</div>
            <div class="dados">
                ${linhaDado("Setor", c.setor)}${linhaDado("Processo afetado", c.processo)}${linhaDado("Origem", c.origem)}
                ${linhaDado("Classificação", cl ? `<span class="tag">${esc(cl.campos.gravidade)}</span><span class="t-apoio num">${cl.codigo}</span>` : "—", !!cl)}
                ${linhaDado("Detectada em", br(c.detectada))}${linhaDado("Requisito violado", c.requisito)}${linhaDado("Cliente", c.cliente)}
            </div></section>`;
    }
    function cartaoEnvio(nc) {
        const c = nc.campos;
        if (pode("editar", nc) && nc.estado === "Aberta")
            return `<section class="cartao-s"><h2 class="t-secao">Envio para fechamento</h2>
                <div class="campo"><label for="e-riscos">Riscos revisados</label><textarea id="e-riscos" data-campo="riscos" placeholder="Os riscos e oportunidades do SGQ foram revistos? O que mudou?">${esc(c.riscos)}</textarea></div>
                <div class="campo"><label for="e-mudancas">Mudanças no SGQ</label><textarea id="e-mudancas" data-campo="mudancas" placeholder="Documentos, procedimentos ou processos alterados">${esc(c.mudancas)}</textarea></div>
                <p class="t-apoio">A ISO 9001, 10.2.1 e e f: preenchidos antes de enviar para fechamento.</p>
                <button class="btn btn-sec" style="justify-self:start" data-acao="salvar-envio">Salvar</button></section>`;
        return `<section class="cartao-s"><h2 class="t-secao">Envio para fechamento</h2>
            <div class="dados">${linhaDado("Riscos revisados", c.riscos)}${linhaDado("Mudanças no SGQ", c.mudancas)}</div></section>`;
    }
    function cartaoAtribuicoes(r) {
        const linhas = [...(r.aprovador ? [[r.aprovador, "Aprovador"]] : []), ...r.resp.map((s) => [s, "Responsável"])];
        const semAprovador = !r.aprovador && r.tipo !== "VE";
        return `<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Atribuições</h2>${pode("responsavel", r) ? `<button class="link-sec" data-acao="pessoas" data-id="${r.id}">+ Responsável</button>` : ""}</div>
            <div class="linhas pessoas">${linhas.map(([s, f]) => `<div class="pessoa-linha">${av(s, "m")}<span class="txt">${esc(voce(s))}</span>${funcaoTag(f)}</div>`).join("")}</div>
            ${semAprovador ? `<div class="aviso">${ic("alerta")}<span>Sem aprovador. ${pode("aprovador", r) ? "Defina quem aprova." : "A qualidade define na triagem."}</span></div>` : ""}
            ${pode("aprovador", r) ? `<button class="btn btn-sec" style="justify-self:start" data-acao="aprovador" data-id="${r.id}">${r.aprovador ? "Trocar o aprovador" : "Definir o aprovador"}</button>` : ""}
        </section>`;
    }
    const cartaoAnexos = (r) => `<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Anexos (${r.anexos.length})</h2>${pode("editar", r) ? '<button class="link-sec" data-acao="fora">+ Anexar</button>' : ""}</div>
            ${r.anexos.length ? r.anexos.map(([n, t]) => `<div class="dado anexo-linha"><span class="k">${esc(n)}</span><span class="v num">${esc(t)}</span></div>`).join("") : '<p class="t-apoio">Nenhum anexo.</p>'}</section>`;

    function cartaoItens(nc) {
        const todos = filhosDe(nc.id).filter((r) => r.estado !== "Rascunho" || colab(r));
        const fechados = todos.filter((it) => it.estado === "Fechada").length;
        const notas = { CL: "quem classifica é a qualidade", AC: "nasce de uma investigação aberta", VE: "nasce sozinha ao finalizar uma ação" };
        const grupos = FILHOS.map((t) => {
            const lista = todos.filter((r) => r.tipo === t);
            const chave = `${nc.id}:${t}`;
            const aberto = E.grupos[chave] ?? (desk || lista.some((it) => it.estado !== "Fechada" && it.estado !== "Cancelada"));
            const nota = lista.length && lista.every((it) => it.estado === "Fechada") ? "fechada" : notas[t];
            const podeNova = t === "AC" ? filhosDe(nc.id, "IV").some((iv) => pode("criarAC", iv)) : t !== "VE" && pode("criar", nc, t);
            return `<div class="itens-grupo">
                <div class="itens-cab"><button class="grupo-bt" data-acao="grupo" data-id="${chave}" aria-expanded="${aberto}">${ic(aberto ? "baixo" : "direita")}<span class="tipo">${TIPOS[t].nome}</span><span class="num">${lista.length}</span>${nota ? `<span class="nota">· ${esc(nota)}</span>` : ""}</button>${podeNova ? `<button class="link-sec" data-acao="novo-filho" data-id="${t}">+ Nova</button>` : ""}</div>
                ${aberto ? lista.map(cartaoItem).join("") : ""}</div>`;
        }).join("");
        return `<div class="itens-topo"><span class="progresso-linha"><span class="t-apoio num">${fechados} de ${todos.length} fechados</span>${segmentos(fechados, todos.length)}</span></div>${grupos}`;
    }
    const cartaoItem = (it) => {
        const venc = (it.tipo === "AC" || it.tipo === "VE" || it.tipo === "CT") && it.estado !== "Fechada" && it.estado !== "Cancelada" && it.campos.prazo;
        return `<button class="item" data-acao="abrir" data-id="${it.id}"><span class="l1"><span class="t-apoio num">${esc(nomeItem(it))}</span><span class="dir">${pilula(it.estado)}${avatares(it.resp.slice(0, 2))}</span></span>
            <span class="trunc">${esc(textoDe(it))}</span>${it.tipo === "AC" && it.planoAprovado && it.estado === "Aberta" ? '<span class="t-rotulo">Plano aprovado · em execução</span>' : ""}${venc ? `<span class="t-rotulo">${prazoTag(it.campos.prazo)}</span>` : ""}</button>`;
    };

    function capa(r, nc) {
        const ehNC = r.tipo === "NC";
        const reprov = r.reprovacao && r.estado === "Aberta"
            ? `<div class="reprovado" role="note"><span class="t-rotulo">Reprovad${ehNC ? "a" : "o"} por ${esc(voce(r.reprovacao.por))} · ${haQuanto(r.reprovacao.ts)}</span><span>“${esc(r.reprovacao.motivo)}”</span><span class="t-rotulo">Corrija e envie de novo.</span></div>`
            : "";
        const fechado = r.estado === "Fechada" && r.fechadoEm ? `<p class="t-rotulo">Fechada em ${new Date(r.fechadoEm).toLocaleDateString("pt-BR")}${r.aprovadoPor ? ` · aprovada por ${esc(nomeDe(r.aprovadoPor))}` : ""}</p>` : "";
        return `<section class="capa pad" aria-label="${ehNC ? "A NC" : "O item"}">
            ${ehNC ? "" : `<button class="caminho t-apoio" data-acao="abrir" data-id="${nc.id}">${nc.codigo} · ${esc(nc.campos.titulo)} ${ic("direita", "p")}</button>`}
            <div class="l1">${pilula(r.estado)}${avatares(r.resp)}</div>
            <h1 class="t-pagina">${esc(ehNC ? r.campos.titulo : TIPOS[r.tipo].nome)}</h1>
            ${ehNC ? `<div class="etapa">${etapa(etapaDe(r))}${indicadoresHtml(r)}</div>` : `<div class="etapa">${r.tipo === "AC" && r.planoAprovado ? `<span>${ic("feito")}Plano aprovado</span>` : ""}${r.campos.prazo && r.estado !== "Fechada" && r.estado !== "Cancelada" ? prazoTag(r.campos.prazo) : ""}</div>`}
            ${fechado}${reprov}
        </section>`;
    }

    function telaNc() {
        const nc = R(E.ncId);
        if (!nc) return trocarTelaInicial();
        const abas = [
            ["resumo", "Resumo"],
            ["detalhes", "Detalhes"],
            ["itens", `Itens <span class="contador num">${filhosDe(nc.id).filter((r) => r.estado !== "Rascunho").length}</span>`],
            ["feed", "Feed"],
        ];
        const descricao = `<section class="cartao-s"><h2 class="t-secao">Descrição</h2><p class="t-longo">${esc(nc.campos.descricao)}</p></section>`;
        const cab = `<header class="barra-sup pad sem-fio"><button class="alvo" data-acao="voltar" aria-label="Voltar">${ic("voltar", "g")}</button><span class="t num">${nc.codigo}</span>${botaoMais(nc)}</header>`;
        if (desk) return telaNcPC(nc);
        let corpo = "";
        if (E.aba === "resumo") corpo = `${descricao}${nc.estado === "Aberta" ? cartaoChecklist(nc) : ""}<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Atividade recente</h2><button class="link-sec" data-acao="ir-aba" data-id="feed">Ver tudo</button></div>${listaFeed(feedDe(nc.id).slice(0, 2), true)}</section>`;
        else if (E.aba === "detalhes") corpo = `${descricao}${cartaoDados(nc)}${cartaoEnvio(nc)}${cartaoAtribuicoes(nc)}${cartaoAnexos(nc)}`;
        else if (E.aba === "itens") corpo = cartaoItens(nc);
        else corpo = listaFeed(feedDe(nc.id));
        const comp = E.aba === "feed" && pode("comentar", nc);
        return `${cab}
        <main>${capa(nc, nc)}
            <div class="pad">
                <div class="abas" role="tablist">${abas.map(([id, nome]) => `<button class="aba" role="tab" data-acao="aba" data-id="${id}" aria-selected="${E.aba === id}">${nome}</button>`).join("")}</div>
                <div class="conteudo">${corpo}</div>
            </div>
            <div class="${comp ? "folga-compositor" : "folga-acoes"}"></div>
        </main>
        ${comp ? compositor() : barraAcoes(nc)}`;
    }
    function trocarTelaInicial() {
        E.tela = telaInicial();
        return TELAS[E.tela]();
    }

    // ─── A barra de ações (fluxo-app §7): só o que vale no estado, para quem pode ──────────
    function botoesAcao(r) {
        const b = [];
        const bt = (acao, rotulo, cls = "btn-sec", extra = "") => `<button class="btn ${cls}" data-acao="${acao}" data-id="${r.id}" ${extra}>${rotulo}</button>`;
        if (pode("decidir", r)) {
            b.push(bt("reprovar", "Reprovar"), bt("aprovar", r.tipo === "AC" ? "Aprovar o plano" : r.tipo === "NC" ? "Aprovar o fechamento" : "Aprovar", "btn-pri"));
            return b;
        }
        if (pode("publicar", r)) b.push(bt("excluir", "Excluir", "btn-sec estreito"), bt("publicar-item", "Publicar", "btn-pri"));
        if (pode("submeter", r)) {
            const f = faltas(r);
            const rotulo = r.tipo === "NC" ? "Enviar para fechamento" : r.tipo === "AC" ? "Enviar plano para aprovação" : "Enviar para aprovação";
            b.push(f.length ? bt("bloqueado", `${rotulo} ${ic("info")}`, "btn-bloq") : bt("submeter", rotulo, "btn-pri"));
        }
        if (pode("finalizar", r)) b.push(faltasFinalizar(r).length ? bt("bloqueado-fin", `Finalizar execução ${ic("info")}`, "btn-bloq") : bt("finalizar", "Finalizar execução", "btn-pri"));
        if (pode("concluir", r)) b.push(bt("concluir", "Concluir a verificação", "btn-pri"));
        if (pode("retirar", r)) b.push(bt("retirar", "Retirar da aprovação"));
        if (pode("reabrir", r)) b.push(bt("reabrir", "Reabrir a NC"));
        return b;
    }
    function barraAcoes(r) {
        const b = botoesAcao(r);
        return b.length ? `<div class="barra-acoes">${b.join("")}</div>` : "";
    }
    const botaoMais = (r) => (pode("cancelar", r) ? `<button class="alvo" data-acao="mais" data-id="${r.id}" aria-label="Mais ações">${ic("mais", "g")}</button>` : '<span class="alvo"></span>');

    // ─── O feed (o mesmo desenho na aba Feed, na Atividade recente e na Atividade do item) ──
    const feedDe = (nc, item = null) => (E.feed[nc] || []).filter((ev) => !item || ev.item === item);
    function listaFeed(eventos, curto = false) {
        if (!eventos.length) return '<p class="t-apoio">Nada ainda.</p>';
        const grupos = [];
        let dia = "";
        for (const ev of eventos) {
            const d = diaDe(ev.ts);
            if (curto || d !== dia) grupos.push({ dia: d, evs: [] });
            dia = d;
            grupos.at(-1).evs.push(ev);
        }
        const quando = (ev) => (curto ? `${diaDe(ev.ts)}, ${horaDe(ev.ts)}` : horaDe(ev.ts));
        const evento = (ev) =>
            ev.tipo === "comentario"
                ? `<div class="evento"><span class="marca av">${ev.quem}</span><div class="comentario"><div class="quem"><strong>${esc(nomeDe(ev.quem))}</strong><span class="t-rotulo num">${quando(ev)}</span></div><div class="texto">${realcar(ev.texto)}</div></div></div>`
                : `<div class="evento"><span class="marca">${ic(ev.icone, "p")}</span><div class="ev-txt"><div>${esc(ev.texto)}</div><div class="t-rotulo num">${quando(ev)}</div></div></div>`;
        return `<div class="feed">${grupos.map((g) => `${curto ? "" : `<p class="dia">${esc(g.dia)}</p>`}<div class="dia-eventos">${g.evs.map(evento).join("")}</div>`).join("")}</div>`;
    }
    const realcar = (t) => esc(t).replace(/(^|\s)([@#][\wÀ-ÿ-]+)/g, '$1<span class="mencao">$2</span>');

    function compositor(embutido = false) {
        return `<form class="compositor ${embutido ? "embutido" : ""}" id="form-comentario" novalidate>
            <div id="sugestoes"></div>
            <label for="comentario" class="sr">Comentar. Use @ para chamar uma pessoa e # para citar um item.</label>
            <div class="linha-c">
                <textarea id="comentario" rows="1" placeholder="Comentar… @ pessoa, # item" autocomplete="off">${esc(E.rascunhoComentario || "")}</textarea>
                <button class="btn btn-pri" type="submit">Comentar</button>
            </div>
        </form>`;
    }
    // As sugestões do @ e do # (sem redesenhar a tela, para o cursor não pular)
    const sug = { lista: [], ativo: 0, inicio: 0, gatilho: "" };
    function atualizarSugestoes() {
        const ta = document.getElementById("comentario");
        const caixa = document.getElementById("sugestoes");
        if (!ta || !caixa) return;
        const antes = ta.value.slice(0, ta.selectionStart);
        const m = antes.match(/(^|\s)([@#])([\wÀ-ÿ-]*)$/);
        if (!m) {
            sug.lista = [];
            caixa.innerHTML = "";
            return;
        }
        const termo = m[3].toLowerCase();
        sug.gatilho = m[2];
        sug.inicio = antes.length - m[3].length - 1;
        const outras = E.pessoas.filter((p) => p.ativo && p.sigla !== E.usuario && !p.papeis.every((x) => x === "ADMIN" || x === "VISUALIZADOR"));
        sug.lista =
            m[2] === "@"
                ? outras.filter((p) => p.nome.toLowerCase().split(" ").some((parte) => parte.startsWith(termo))).map((p) => ({ chave: p.nome.split(" ")[0], rotulo: p.nome, apoio: `${p.papeis.map((x) => NOME_PAPEL[x]).join(" + ")} · ${p.setor}`, sigla: p.sigla }))
                : filhosDe(E.ncId)
                      .filter((r) => r.codigo?.toLowerCase().includes(termo))
                      .map((r) => ({ chave: r.codigo, rotulo: r.codigo, apoio: textoDe(r) }));
        sug.ativo = Math.min(sug.ativo, Math.max(sug.lista.length - 1, 0));
        caixa.innerHTML = sug.lista.length
            ? `<div class="sugestoes" role="listbox" aria-label="${m[2] === "@" ? "Pessoas" : "Itens"}">
                <div class="dica">${m[2] === "@" ? "Chamar uma pessoa: ela recebe uma pendência" : "Citar um item desta NC"}</div>
                ${sug.lista.map((s, i) => `<button type="button" class="sugestao" role="option" data-acao="sugestao" data-id="${i}" aria-selected="${i === sug.ativo}">${s.sigla ? av(s.sigla) : ic("documento")}<span><span style="display:block">${esc(s.rotulo)}</span><span class="t-rotulo">${esc(s.apoio)}</span></span></button>`).join("")}
            </div>`
            : "";
    }
    function escolherSugestao(i) {
        const s = sug.lista[i];
        const ta = document.getElementById("comentario");
        if (!s || !ta) return;
        const fim = ta.selectionStart;
        const texto = `${ta.value.slice(0, sug.inicio)}${sug.gatilho}${s.chave} ${ta.value.slice(fim)}`;
        ta.value = texto;
        E.rascunhoComentario = texto;
        const pos = sug.inicio + s.chave.length + 2;
        ta.setSelectionRange(pos, pos);
        sug.lista = [];
        document.getElementById("sugestoes").innerHTML = "";
        ta.focus();
    }
    function comentar() {
        const ta = document.getElementById("comentario");
        const texto = ta.value.trim();
        if (!texto) {
            ta.focus();
            return;
        }
        const chamados = E.pessoas.filter((p) => p.sigla !== E.usuario && new RegExp(`@${p.nome.split(" ")[0]}(\\b|$)`).test(texto));
        listaDe(E.feed, E.ncId).unshift({ ts: Date.now(), tipo: "comentario", quem: E.usuario, texto });
        for (const p of chamados) E.mencoes.push({ para: p.sigla, nc: E.ncId, ts: Date.now() });
        E.rascunhoComentario = "";
        desenhar();
        document.querySelector(".feed .evento")?.scrollIntoView({ block: "center" });
        const nomes = chamados.map((p) => p.nome);
        if (nomes.length === 1) avisar(`Comentário publicado. ${nomes[0]} vai ver na pendência.`);
        else if (nomes.length > 1) avisar(`Comentário publicado. ${nomes.join(" e ")} vão ver na pendência.`);
        else avisar("Comentário publicado.");
    }
    // ─── T-07 Detalhe do item filho: o padrão dos cinco (ui-ux §7.4) ─────────────────────
    // Os campos se guardam sozinhos ao sair deles (o evento change): a barra de ações recalcula o que falta
    function fld(r, campo, rotulo, o = {}) {
        const v = r.campos[campo] ?? "";
        const ed = o.editavel ?? podeEditarCampos(r);
        if (!ed) return linhaDado(rotulo, o.tipo === "date" ? br(v) : o.mostrar ? o.mostrar(v) : v);
        const id = `c-${campo}`;
        const attrs = `id="${id}" data-campo="${campo}" data-reg="${r.id}" ${o.ajuda ? `aria-describedby="${id}-a"` : ""}`;
        let html;
        if (o.tipo === "textarea") html = `<textarea ${attrs} placeholder="${esc(o.placeholder || "")}">${esc(v)}</textarea>`;
        else if (o.tipo === "select") html = `<select ${attrs}><option value="">Escolha</option>${o.opcoes.map((x) => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select>`;
        else if (o.tipo === "date") html = `<input type="date" ${attrs} value="${esc(v)}" ${o.max ? `max="${o.max}"` : ""}>`;
        else html = `<input ${attrs} value="${esc(v)}" placeholder="${esc(o.placeholder || "")}">`;
        const atalhos = o.atalhos ? `<div class="atalhos-data">${o.atalhos.map(([rot, n]) => `<button type="button" class="chip" data-acao="data-rapida" data-id="${r.id}" data-campo="${campo}" data-dias="${n}">${rot}</button>`).join("")}</div>` : "";
        return `<div class="campo"><label for="${id}">${rotulo}</label>${html}${atalhos}${o.ajuda ? `<span class="ajuda" id="${id}-a">${esc(o.ajuda)}</span>` : ""}</div>`;
    }
    const podeEditarCampos = (r) => pode("editar", r) && !(r.tipo === "AC" && r.planoAprovado);
    function escolha(r, campo, rotulo, opcoes, editavel = podeEditarCampos(r)) {
        const v = r.campos[campo];
        if (!editavel) return linhaDado(rotulo, opcoes.find(([k]) => k === v)?.[1] || v);
        return `<div class="campo"><span class="rotulo-campo">${rotulo}</span><div class="segmentado" role="group" aria-label="${rotulo}">${opcoes.map(([k, nome]) => `<button type="button" data-acao="valor" data-id="${r.id}" data-campo="${campo}" data-valor="${k}" aria-pressed="${v === k}">${nome}</button>`).join("")}</div></div>`;
    }

    function formClassificacao(r) {
        return `<section class="cartao-s">${escolha(r, "gravidade", "Classificação", [["Maior", "Maior"], ["Menor", "Menor"]])}
            ${fld(r, "justificativa", "Justificativa", { tipo: "textarea", placeholder: "Por que Maior ou Menor" })}
            <p class="t-apoio">Maior: afeta o cliente, a segurança ou para o processo. Menor: um desvio pontual, sem efeito no produto.</p></section>`;
    }
    function formContencao(r) {
        return `<section class="cartao-s">
            ${fld(r, "descricao", "O que fazer agora", { tipo: "textarea", placeholder: "A ação imediata: segregar, isolar, reinspecionar" })}
            ${fld(r, "prazo", "Prazo", { tipo: "date" })}
            </section><section class="cartao-s"><h2 class="t-secao">Execução</h2>
            ${fld(r, "execucao", "Executada em", { tipo: "date", max: hojeIso(), atalhos: [["Hoje", 0], ["Ontem", 1]] })}
            ${fld(r, "disposicao", "Disposição", { tipo: "select", opcoes: DISPOSICOES, ajuda: "O que foi feito com o produto: aceito como está, corrigido, anulado (sucata) ou ainda em análise" })}
            ${r.estado === "Aberta" && pode("editar", r) ? '<p class="t-apoio">Se não funcionou, crie outra contenção: a fechada não reabre.</p>' : ""}</section>`;
    }
    function formAcao(r) {
        const iv = R(r.campos.iv);
        const ivLink = iv ? `<button class="link" data-acao="abrir" data-id="${iv.id}">${esc(iv.codigo)}</button>` : "—";
        const plano = r.planoAprovado
            ? `<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Plano</h2><span class="tag">${ic("feito", "p")} aprovado</span></div>
                <div class="dados plano-grade">${linhaDado("Descrição", r.campos.descricao)}${linhaDado("Instruções de verificação", r.campos.instrucoes)}${linhaDado("Prazo", `${br(r.campos.prazo)}`)}${linhaDado("Investigação", ivLink, true)}</div></section>`
            : `<section class="cartao-s"><h2 class="t-secao">Plano</h2>
                ${fld(r, "descricao", "Descrição", { tipo: "textarea", placeholder: "O que vai ser feito para a causa raiz não voltar" })}
                ${fld(r, "prazo", "Prazo", { tipo: "date", atalhos: [["Em 15 dias", -15], ["Em 30 dias", -30]] })}
                ${fld(r, "instrucoes", "Instruções de verificação", { tipo: "textarea", placeholder: "Como a qualidade vai conferir a eficácia depois", ajuda: "Viram as instruções da verificação, quando a ação for finalizada" })}
                ${linhaDado("Investigação", `${ivLink} <span class="t-rotulo">o vínculo não muda</span>`, true)}</section>`;
        const exec = r.planoAprovado
            ? `<section class="cartao-s"><h2 class="t-secao">Execução</h2>
                ${fld(r, "execucao", "Executada em", { tipo: "date", max: hojeIso(), atalhos: [["Hoje", 0], ["Ontem", 1]], editavel: pode("editar", r) })}
                ${fld(r, "evidencia", "Evidência", { tipo: "textarea", placeholder: "O que foi feito, com fotos ou documentos", editavel: pode("editar", r) })}
                ${r.estado === "Aberta" && pode("finalizar", r) ? `<p class="t-apoio">Para finalizar: a data e a evidência. A verificação nasce sozinha para ${esc(nomeDe(r.aprovador))}.</p>` : ""}</section>`
            : `<section class="cartao-s fechado"><h2 class="t-secao">Execução</h2><p class="t-apoio">Abre depois que o plano for aprovado.</p></section>`;
        return plano + exec;
    }
    function formVerificacao(r) {
        const ed = podeEditarCampos(r);
        const ac = R(r.campos.ac);
        return `<section class="cartao-s"><h2 class="t-secao">O que conferir</h2>
                <div class="dados">${linhaDado("Instruções", r.campos.instrucoes)}${linhaDado("Prazo", br(r.campos.prazo))}${linhaDado("Ação", ac ? `<button class="link" data-acao="abrir" data-id="${ac.id}">${ac.codigo}</button>` : "—", true)}</div></section>
            <section class="cartao-s"><h2 class="t-secao">Resultado</h2>
                ${escolha(r, "resultado", "A ação foi", Object.entries(RESULTADOS), ed)}
                ${fld(r, "conclusao", "Conclusão", { tipo: "textarea", placeholder: "O que você viu na checagem" })}
                ${fld(r, "data", "Verificada em", { tipo: "date", max: hojeIso(), atalhos: [["Hoje", 0]] })}
                ${ed ? '<p class="t-apoio">Parcialmente eficaz cria uma ação nova; não eficaz reabre a investigação e a NC. Antes de concluir, o sistema confirma.</p>' : ""}</section>`;
    }

    // A investigação A3: uma seção por etapa, com o índice no topo (ui-ux §7.5)
    function formInvestigacao(r) {
        const c = r.campos;
        const ed = podeEditarCampos(r);
        const cheio = (v) => (Array.isArray(v) ? v.some((x) => String(x ?? "").trim()) : typeof v === "object" && v ? Object.values(v).some((x) => String(x).trim()) : !!String(v ?? "").trim());
        const acs = filhosDe(r.nc, "AC").filter((a) => a.campos.iv === r.id && (a.estado !== "Rascunho" || colab(a)));
        const etapas = [
            ["percepcao", "Percepção inicial", cheio(c.percepcao)],
            ["descricaoA3", "Descrição", cheio(c.descricaoA3)],
            ["realProblema", "Real problema", cheio(c.realProblema)],
            ["ishikawa", "Ishikawa", cheio(c.ishikawa)],
            ["hipoteses", "Hipóteses", (c.hipoteses || []).length > 0],
            ["causaDireta", "Causa direta", cheio(c.causaDireta)],
            ["porques", "5 Porquês", cheio(c.porques)],
            ["causaRaiz", "Causa raiz", cheio(c.causaRaiz)],
            ["contramedidas", "Contramedidas", acs.length > 0],
            ["check", "Check de efetividade", acs.some((a) => a.estado === "Fechada")],
        ];
        const indice = `<nav class="indice-a3" aria-label="Etapas do A3">${etapas.map(([id, nome, ok], i) => `<button class="chip ${ok ? "ok" : ""}" data-acao="rolar" data-id="a3-${id}">${ok ? ic("feito", "p") : `<span class="num">${i + 1}</span>`}${nome}</button>`).join("")}</nav>`;
        const sec = (id, nome, corpo) => `<section class="cartao-s" id="a3-${id}"><h2 class="t-secao">${nome}</h2>${corpo}</section>`;
        const marcada = (c.hipoteses || []).find((h) => h.classe === "Causa direta");
        const hip = (c.hipoteses || [])
            .map(
                (h, i) => `<div class="hipotese"><div class="cab-cartao"><span class="t-rotulo">Hipótese ${i + 1}${h.num ? ` · causa ${esc(h.num)} no Ishikawa` : ""}</span>${h.classe ? `<span class="tag ${h.classe === "Causa direta" ? "forte" : ""}">${esc(h.classe)}</span>` : '<span class="tag">sem resultado</span>'}</div>
                <p>${esc(h.desc || "—")}</p><p class="t-apoio">Como verificar: ${esc(h.comoVerificar || "—")}</p>
                ${ed ? `<button class="link-sec" style="justify-self:start" data-acao="hipotese" data-id="${r.id}" data-indice="${i}">Editar</button>` : ""}</div>`,
            )
            .join("");
        const ishikawa = ed
            ? `<div class="grade-6m">${SEIS_M.map((m) => `<div class="campo"><label for="ish-${m}">${m}</label><input id="ish-${m}" data-ishikawa="${m}" data-reg="${r.id}" value="${esc(c.ishikawa?.[m] || "")}" placeholder="1. causa possível"></div>`).join("")}</div>`
            : `<div class="dados">${SEIS_M.filter((m) => c.ishikawa?.[m]).map((m) => linhaDado(m, c.ishikawa[m])).join("") || '<p class="t-apoio">—</p>'}</div>`;
        const porques = ed
            ? `<ol class="porques">${[0, 1, 2, 3, 4].map((i) => `<li class="campo"><label for="pq-${i}" class="sr">Por quê ${i + 1}</label><input id="pq-${i}" data-porque="${i}" data-reg="${r.id}" value="${esc(c.porques?.[i] || "")}" placeholder="${i === 0 ? "Por que aconteceu?" : "E por quê?"}"></li>`).join("")}</ol>`
            : `<ol class="porques">${(c.porques || []).filter(Boolean).map((p) => `<li>${esc(p)}</li>`).join("") || "<li>—</li>"}</ol>`;
        const contramedidas = `${acs.map(cartaoItem).join("") || '<p class="t-apoio">Nenhuma ação ainda. A investigação pode fechar sem ação, se a causa já foi tratada.</p>'}
            ${pode("criarAC", r) ? `<button class="btn btn-sec" style="justify-self:start" data-acao="nova-ac" data-id="${r.id}">${ic("criar")}Nova ação corretiva</button>` : ""}
            ${acs.some((a) => vivo(a) && !a.planoAprovado) ? '<p class="t-apoio">A investigação só é enviada com os planos de todas as ações aprovados.</p>' : ""}`;
        const check = acs.length
            ? acs.map((a) => {
                  const ve = filhosDe(r.nc, "VE").find((v) => v.campos.ac === a.id);
                  return linhaDado(a.codigo || "Rascunho", ve?.campos.resultado ? RESULTADOS[ve.campos.resultado] : ve ? `${ve.codigo}: a verificar até ${br(ve.campos.prazo)}` : a.campos.instrucoes || "—");
              }).join("")
            : '<p class="t-apoio">O resumo das verificações de cada contramedida aparece aqui.</p>';
        return `${indice}
            ${sec("percepcao", "1 · Percepção inicial", fld(r, "percepcao", "O que foi percebido", { tipo: "textarea" }))}
            ${sec("descricaoA3", "2 · Descrição", fld(r, "descricaoA3", "Onde, quando, quanto", { tipo: "textarea" }))}
            ${sec("realProblema", "3 · Real problema", fld(r, "realProblema", "O problema de fato", { tipo: "textarea" }))}
            ${sec("ishikawa", "4 · Ishikawa", `<p class="t-apoio">As causas possíveis, numeradas: as hipóteses apontam para elas.</p>${ishikawa}`)}
            ${sec("hipoteses", "5 · Hipóteses", `${hip || '<p class="t-apoio">Nenhuma hipótese ainda.</p>'}${ed ? `<button class="btn btn-sec" style="justify-self:start" data-acao="hipotese" data-id="${r.id}" data-indice="-1">${ic("criar")}Nova hipótese</button>` : ""}`)}
            ${sec("causaDireta", "6 · Causa direta", `${marcada && ed ? `<p class="t-apoio">Da hipótese marcada: “${esc(marcada.desc)}”. Confirme ou ajuste a redação.</p>` : ""}${fld(r, "causaDireta", "Causa direta", { tipo: "textarea" })}`)}
            ${sec("porques", "7 · 5 Porquês", porques)}
            ${sec("causaRaiz", "8 · Causa raiz", fld(r, "causaRaiz", "Causa raiz", { tipo: "textarea" }))}
            ${sec("contramedidas", "9 · Contramedidas", contramedidas)}
            ${sec("check", "10 · Check de efetividade", check)}`;
    }

    function telaItem() {
        const r = R(E.itemId);
        if (!r) return trocarTelaInicial();
        const nc = R(r.nc);
        const form = { CL: formClassificacao, CT: formContencao, IV: formInvestigacao, AC: formAcao, VE: formVerificacao }[r.tipo](r);
        const n = feedDe(nc.id, r.id).length;
        const atividade = `<button class="atalho-atividade" data-acao="atividade" data-id="${r.id}">${ic("atividade", "g")}<span class="corpo"><span>Atividade deste item</span><span class="t-rotulo">${n} ${n === 1 ? "evento" : "eventos"} · no feed da ${nc.codigo}</span></span>${ic("direita")}</button>`;
        const cab = `<header class="barra-sup pad sem-fio"><button class="alvo" data-acao="voltar" aria-label="Voltar">${ic("voltar", "g")}</button><span class="t num">${esc(nomeItem(r))}</span>${botaoMais(r)}</header>`;
        if (desk) return telaItemPC(r, nc, form);
        return `${cab}<main>${capa(r, nc)}<div class="pad conteudo">${form}${cartaoAtribuicoes(r)}${cartaoAnexos(r)}${atividade}</div><div class="folga-acoes"></div></main>${barraAcoes(r)}`;
    }
    // ─── O computador, como na página Mockups do Figma (T-03 a T-13 · computador) ─────────
    // Sem barra no topo: cada tela abre com o bloco do título, e as ações ficam à direita dele.
    function blocoTitulo(r, nc) {
        const ehNC = r.tipo === "NC";
        const linha2 = ehNC
            ? `${etapa(etapaDe(r))}${indicadoresHtml(r)}`
            : `${r.tipo === "AC" && r.planoAprovado ? `<span class="et">${ic("feito", "p")}Plano aprovado</span>` : ""}${r.campos.prazo && r.estado !== "Fechada" && r.estado !== "Cancelada" ? prazoTag(r.campos.prazo) : ""}`;
        const reprov = r.reprovacao && r.estado === "Aberta" ? `<div class="reprovado" role="note"><span class="t-rotulo">Reprovad${ehNC ? "a" : "o"} por ${esc(voce(r.reprovacao.por))} · ${haQuanto(r.reprovacao.ts)}</span><span>“${esc(r.reprovacao.motivo)}”</span><span class="t-rotulo">Corrija e envie de novo.</span></div>` : "";
        const fechado = r.estado === "Fechada" && r.fechadoEm ? `<p class="t-rotulo">Fechada em ${new Date(r.fechadoEm).toLocaleDateString("pt-BR")}${r.aprovadoPor ? ` · aprovada por ${esc(nomeDe(r.aprovadoPor))}` : ""}</p>` : "";
        const mais = pode("cancelar", r) || pode("reabrir", r) ? `<button class="btn btn-sec" data-acao="mais" data-id="${r.id}">Mais ${ic("baixo")}</button>` : "";
        const acoes = botoesAcao(r).filter((b) => !b.includes('data-acao="reabrir"'));
        return `<section class="bloco-titulo">
            <div class="bloco-corpo">
                ${ehNC ? "" : `<button class="caminho t-apoio" data-acao="abrir" data-id="${nc.id}">${nc.codigo} · ${esc(nc.campos.titulo)} ${ic("direita", "p")} ${esc(nomeItem(r))}</button>`}
                <h1 class="t-pagina">${ehNC ? `${r.codigo} · ${esc(r.campos.titulo)}` : esc(TIPOS[r.tipo].nome)}</h1>
                <div class="bloco-linha">${pilula(r.estado)}<span class="etapa">${linha2}</span>${avatares([...(r.aprovador ? [r.aprovador] : []), ...r.resp.filter((s) => s !== r.aprovador)])}</div>
                ${fechado}${reprov}
            </div>
            <div class="bloco-acoes">${acoes.join("")}${mais}</div>
        </section>`;
    }
    const atalhoAtividade = (r, nc) => {
        const n = feedDe(nc.id, r.tipo === "NC" ? null : r.id).length;
        const comentarios = feedDe(nc.id).filter((e) => e.tipo === "comentario").length;
        return `<button class="atalho-atividade cinza" data-acao="${r.tipo === "NC" ? "painel-atividade" : "atividade"}" data-id="${r.id}">${ic("conversa", "g")}<span class="corpo"><span>${r.tipo === "NC" ? "Atividade" : "Atividade deste item"}</span><span class="t-rotulo">${r.tipo === "NC" ? `${comentarios} ${comentarios === 1 ? "comentário" : "comentários"} · ${n} eventos` : `${n} ${n === 1 ? "evento" : "eventos"} · no feed da ${nc.codigo}`}</span></span>${ic("direita")}</button>`;
    };

    function cabItensPC(nc) {
        const todos = filhosDe(nc.id).filter((r) => r.estado !== "Rascunho" || colab(r));
        const fechados = todos.filter((it) => it.estado === "Fechada").length;
        return `<div class="cab-cartao"><span class="et"><h2 class="t-secao">Itens da NC</h2><span class="t-apoio num">· ${fechados} de ${todos.length} fechados</span>${segmentos(fechados, todos.length)}</span>
            <span class="et"><button class="btn btn-sec btn-barra" data-acao="fora">Ordenar: estado ${ic("baixo")}</button></span></div>`;
    }
    function tabelaItensPC(nc) {
        const todos = filhosDe(nc.id).filter((r) => r.estado !== "Rascunho" || colab(r));
        const notas = { AC: "nasce de uma investigação aberta", VE: "nasce sozinha ao finalizar uma ação" };
        return FILHOS.map((t) => {
            const lista = todos.filter((r) => r.tipo === t);
            const chave = `${nc.id}:${t}`;
            const aberto = E.grupos[chave] ?? lista.some((it) => it.estado !== "Fechada" && it.estado !== "Cancelada");
            const nota = lista.length && lista.every((it) => it.estado === "Fechada") ? "fechada" : notas[t];
            const podeNova = t === "AC" ? filhosDe(nc.id, "IV").some((iv) => pode("criarAC", iv)) : t !== "VE" && pode("criar", nc, t);
            const linha = (it) => {
                const prazo = it.estado !== "Fechada" && it.estado !== "Cancelada" && it.campos.prazo;
                return `<button class="item-linha" data-acao="abrir" data-id="${it.id}"><span class="trunc"><span class="t-apoio num">${esc(nomeItem(it))}</span> · ${esc(textoDe(it))}</span><span>${pilula(it.estado)}</span><span class="et">${av(it.resp[0])}${esc(nomeDe(it.resp[0]))}</span><span>${!prazo ? '<span class="t-apoio">—</span>' : nivelPrazo(it.campos.prazo) ? prazoTag(it.campos.prazo) : `<span class="num">${br(it.campos.prazo)}</span>`}</span></button>`;
            };
            return `<div class="grupo-pc"><div class="itens-cab"><button class="grupo-bt" data-acao="grupo" data-id="${chave}" aria-expanded="${aberto}">${ic(aberto ? "baixo" : "direita")}<span class="tipo">${TIPOS[t].nome}</span><span class="num">${lista.length}</span>${nota ? `<span class="nota">· ${esc(nota)}</span>` : ""}</button>${podeNova ? `<button class="link-sec" data-acao="novo-filho" data-id="${t}">+ Nova</button>` : ""}</div>
                ${aberto ? lista.map(linha).join("") : ""}</div>`;
        }).join("");
    }

                    <p class="t-secao">${esc(urg.titulo)}</p>

            ${urgente}
            <div class="duas-colunas">
                <div>${gavetasHtml}</div>
                <aside><h2 class="t-secao secao-titulo">Suas NCs</h2><div class="suas-ncs">${minhas
                    .slice(0, 5)
                    .map((nc) => `<button class="sua-nc" data-acao="abrir" data-id="${nc.id}">${ic("arquivo", "g")}<span class="corpo"><span>${nc.codigo} · ${esc(nc.campos.titulo)}</span><span class="t-apoio">${etapa(etapaDe(nc))}</span></span>${ic("direita")}</button>`)
                    .join("") || '<p class="sua-nc t-apoio">Nenhuma NC com você.</p>'}
                    <button class="link sua-nc-todas" data-acao="minhas-ncs">Ver todas as suas NCs</button></div></aside>
            </div>
            <div class="folga-barra"></div></main>${navegacao("pendencias")}`;

    // T-05 no computador
    function telaNovaPC(formHtml, resp, anexos) {
        const f = E.form || {};
        return `<main class="pc">
            <header class="cab-pagina"><div><h1 class="t-pagina">${f.editId ? "Rascunho da NC" : "Nova Não Conformidade"}</h1><p class="t-apoio">Rascunho: ganha código ao publicar</p></div>
                <div class="bloco-acoes"><button class="btn btn-sec" data-acao="fechar-nova">Cancelar</button><button class="btn btn-sec" data-acao="salvar-rascunho">Salvar rascunho</button><button class="btn btn-pri" data-acao="publicar" ${E.publicando ? "disabled" : ""}>${E.publicando ? "Publicando…" : "Publicar"}</button></div></header>
            <div class="duas-colunas"><section class="cartao-s">${formHtml}</section>
                <aside class="coluna-lado"><section class="cartao-s"><h2 class="t-secao">Responsáveis</h2><p class="t-apoio">Quem vai trabalhar na NC. Você entra como responsável.</p>${resp}<button type="button" class="link-sec" style="justify-self:start" data-acao="pessoas-form">+ Adicionar responsável</button></section>
                <section class="cartao-s"><h2 class="t-secao">Anexos</h2>${anexos}</section></aside></div>
            <div class="folga-barra"></div></main>${navegacao("ncs")}`;
    }

    // A Atividade no computador: um painel na altura toda, à direita, que empurra a página (Figma, T-06 · atividade aberta).
    // Enquanto ele está aberto, a coluna da direita vira uma faixa de cartões em cima do conteúdo.
    function painelAtividade(nc) {
        const p = E.painelAtividade;
        const filtro = E.filtroAtividade || "Tudo";
        let evs = feedDe(nc.id, p.item || null);
        if (filtro === "Comentários") evs = evs.filter((e) => e.tipo === "comentario");
        if (filtro === "Histórico") evs = evs.filter((e) => e.tipo !== "comentario");
        return `<aside class="painel-lateral" aria-label="Atividade">
            <div class="cab-cartao"><h2 class="t-secao">Atividade</h2><button class="alvo" data-acao="fechar-painel" aria-label="Fechar a atividade">${ic("x", "g")}</button></div>
            <div class="segmentado" role="group" aria-label="O que mostrar">${["Tudo", "Comentários", "Histórico"].map((f) => `<button data-acao="filtro-atividade" data-id="${f}" aria-pressed="${filtro === f}">${f}</button>`).join("")}</div>
            ${p.item ? `<button class="chip filtro-ativo" data-acao="painel-tudo">Só este item: ${esc(nomeItem(R(p.item)))} ${ic("x", "p")}</button>` : ""}
            <div class="painel-rolar">${listaFeed(evs)}</div>
            ${pode("comentar", nc) ? compositor(true) : ""}
        </aside>`;
    }
    function faixaLado(r) {
        const cartoes = [];
        if (r.tipo === "NC" && r.estado === "Aberta") {
            const ch = checklist(r);
            const ok = ch.filter((x) => x.ok).length;
            cartoes.push(["checklist", "Checklist de fechamento", `<strong class="num">${ok} de ${ch.length}</strong>${segmentos(ok, ch.length)}<span class="t-apoio">${ch.length - ok} pendentes</span>`, cartaoChecklist(r)]);
        }
        cartoes.push(["atribuicoes", "Atribuições", `${r.aprovador ? `${av(r.aprovador)}<span class="tag forte">Aprovador</span>` : '<span class="tag">Sem aprovador</span>'}${avatares(r.resp)}<span class="tag">${r.resp.length} ${r.resp.length === 1 ? "responsável" : "responsáveis"}</span>`, cartaoAtribuicoes(r)]);
        cartoes.push(["anexos", "Anexos", `${ic("clipe", "p")}<span>${r.anexos.length} ${r.anexos.length === 1 ? "arquivo" : "arquivos"}</span>`, cartaoAnexos(r)]);
        const aberto = cartoes.find(([id]) => id === E.faixaAberta);
        return `<div class="faixa-lado">${cartoes.map(([id, nome, resumo]) => `<button class="faixa-item" data-acao="faixa" data-id="${id}" aria-expanded="${E.faixaAberta === id}"><span class="corpo"><span class="t-rotulo">${nome}</span><span class="et">${resumo}</span></span>${ic(E.faixaAberta === id ? "cima" : "baixo")}</button>`).join("")}</div>${aberto ? aberto[3] : ""}`;
    }
    function telaNcPC(nc) {
        const c = nc.campos;
        const cl = filhosDe(nc.id, "CL").filter((r) => r.estado === "Fechada").sort((a, b) => b.fechadoEm - a.fechadoEm)[0];
        const par = (k, v, html = false) => `<div class="par"><span class="k">${k}</span><span>${html ? v : esc(v || "—")}</span></div>`;
        const dados = `<section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Dados</h2>${pode("editar", nc) ? `<button class="link-sec" data-acao="fora">${ic("editar", "p")} Editar</button>` : ""}</div>
            <div class="pares">${par("Descrição", c.descricao)}${par("Requisito violado", c.requisito)}${par("Processo afetado", c.processo)}${par("Setor", c.setor)}${par("Origem", c.origem)}
            ${par("Classificação", cl ? `<span class="tag">${esc(cl.campos.gravidade)}</span> <span class="t-apoio num">${cl.codigo}</span>` : "—", !!cl)}${par("Detectada em", br(c.detectada))}${par("Cliente", c.cliente)}</div></section>`;
        const principal = `${dados}<section class="cartao-s">${cabItensPC(nc)}${tabelaItensPC(nc)}</section>${cartaoEnvio(nc)}`;
        if (E.painelAtividade)
            return `<main class="pc">${blocoTitulo(nc, nc)}${faixaLado(nc)}<div class="conteudo">${principal}</div><div class="folga-barra"></div></main>${painelAtividade(nc)}${navegacao("ncs")}`;
        return `<main class="pc">${blocoTitulo(nc, nc)}
            <div class="duas-colunas"><div class="conteudo">${principal}</div>
                <aside class="coluna-lado">${atalhoAtividade(nc, nc)}${nc.estado === "Aberta" ? cartaoChecklist(nc) : ""}${cartaoAtribuicoes(nc)}${cartaoAnexos(nc)}</aside></div>
            <div class="folga-barra"></div></main>${navegacao("ncs")}`;
    }
    function telaItemPC(r, nc, form) {
        if (E.painelAtividade)
            return `<main class="pc">${blocoTitulo(r, nc)}${faixaLado(r)}<div class="conteudo">${form}</div><div class="folga-barra"></div></main>${painelAtividade(nc)}${navegacao("ncs")}`;
        return `<main class="pc">${blocoTitulo(r, nc)}
            <div class="duas-colunas"><div class="conteudo">${form}</div>
            <aside class="coluna-lado">${atalhoAtividade(r, nc)}${cartaoAtribuicoes(r)}${cartaoAnexos(r)}</aside></div>
            <div class="folga-barra"></div></main>${navegacao("ncs")}`;
    }

    // ─── T-08 Relatórios (ui-ux §7.12 e a Mockups): a régua manda no período; sem luz (a luz é só da T-03) ──
    const PERIODOS = { Mês: ["Mês", 1, "Este mês"], "3M": ["3 meses", 3, "Últimos 3 meses"], "6M": ["6 meses", 6, "Últimos 6 meses"], "12M": ["12 meses", 12, "Últimos 12 meses"], Ano: ["Ano", 0, "Este ano"], Tudo: ["Tudo", 24, "Todo o histórico"] };
    // a série mensal do tempo até fechar, de mentira, para o desenho do gráfico (o protótipo não tem meses de dados)
    const SERIE_MAIOR = [31, 29, 33, 28, 27, 30, 26, 28, 25, 23, 24, 26];
    const SERIE_MENOR = [21, 19, 22, 18, 17, 20, 18, 19, 17, 16, 17, 18];
    function grafico(series, rotulos) {
        const W = 300;
        const H = 96;
        const todos = series.flatMap((s) => s.v);
        const min = Math.min(...todos) - 2;
        const max = Math.max(...todos) + 2;
        const x = (i, n) => (i / (n - 1)) * W;
        const y = (v) => H - ((v - min) / (max - min)) * H;
        const linhas = series.map((s) => `<polyline points="${s.v.map((v, i) => `${x(i, s.v.length).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--texto)" stroke-width="1.5" ${s.tracejada ? 'stroke-dasharray="4 3" opacity="0.6"' : ""} vector-effect="non-scaling-stroke"/>`).join("");
        return `<svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="O tempo até fechar, mês a mês">${linhas}</svg><div class="eixo t-rotulo">${rotulos.map((r) => `<span>${r}</span>`).join("")}</div>`;
    }
    function telaRelatorios() {
        const ncs = listaNcs();
        const abertas = ncs.filter((nc) => nc.estado === "Aberta" || nc.estado === "Em aprovação");
        const atrasados = Object.values(E.reg).filter((r) => (r.tipo === "AC" || r.tipo === "VE") && r.estado === "Aberta" && r.campos.prazo && diasAte(r.campos.prazo) < 0).sort((a, b) => diasAte(a.campos.prazo) - diasAte(b.campos.prazo));
        const fechadas = ncs.filter((nc) => nc.estado === "Fechada" && nc.fechadoEm);
        const media = (lista) => (lista.length ? Math.round(lista.reduce((s, nc) => s + (nc.fechadoEm - nc.criadoEm) / DIA, 0) / lista.length) : 0);
        const gravidade = (nc) => filhosDe(nc.id, "CL").find((c) => c.estado === "Fechada")?.campos.gravidade;
        const ves = Object.values(E.reg).filter((r) => r.tipo === "VE" && r.estado === "Fechada");
        const conta = (k) => ves.filter((v) => v.campos.resultado === k).length;
        const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0);
        const eficacia = pct(conta("EFICAZ"), ves.length);
        const dim = E.relDim || "setor";
        const contagem = {};
        for (const nc of abertas) {
            const k = dim === "setor" ? nc.campos.setor : nc.campos.origem;
            contagem[k] = (contagem[k] || 0) + 1;
        }
        const barras = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
        const maior = Math.max(...barras.map(([, n]) => n), 1);
        const [, mesesP, rotuloP] = PERIODOS[E.periodo];
        const meses = E.periodo === "Ano" ? new Date().getMonth() + 1 : mesesP;
        const mesAno = (d) => `${MESES[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`;
        const mesesAtras = (n) => new Date(new Date().getFullYear(), new Date().getMonth() - n, 1);
        const recorte = Math.min(100, (meses / 24) * 100);
        const ultimos = Array.from({ length: 12 }, (_, i) => MESES[mesesAtras(11 - i).getMonth()]);
        const col = (titulo, acao, numero, sub, corpo) => `<section class="relatorio"><div class="cab-cartao"><h2 class="t-secao">${titulo}</h2>${acao ? `<button class="alvo pequeno" data-acao="${acao}" aria-label="Ver as NCs deste relatório" title="Ver as NCs deste relatório">${ic("diagonal", "p")}</button>` : ""}</div><p class="numero num">${numero}</p><p class="t-apoio">${sub}</p>${corpo}</section>`;
        return `<main class="${desk ? "pc" : "pad"} relatorios-tela">
            <header class="saudacao"><p class="t-rotulo">${hojePorExtenso()}</p><h1 class="t-pagina">${saudacaoHora()}, ${esc(primeiro(E.usuario))}</h1>
                <p class="t-apoio">${atrasados.length ? `${atrasados.length} ${atrasados.length === 1 ? "item atrasado" : "itens atrasados"}, o mais antigo há ${-diasAte(atrasados[0].campos.prazo)} dias · ` : ""}${abertas.length} NCs abertas</p></header>
            <section class="regua" aria-label="Período">
                <div class="trilho"><span class="recorte" style="width:${recorte}%"></span><span class="marca-regua" style="left:${100 - recorte}%"><span class="dica-regua">${mesAno(mesesAtras(meses - 1))}</span></span></div>
                <div class="pontas t-rotulo"><span>${mesAno(mesesAtras(23))}<br>o começo do histórico</span><span class="dir">${mesAno(new Date())}<br>hoje</span></div>
                <div class="atalhos-regua" role="group" aria-label="Período">${Object.entries(PERIODOS).map(([k, [nome]]) => `<button data-acao="periodo" data-id="${k}" aria-pressed="${E.periodo === k}">${desk ? nome : k}</button>`).join("")}</div>
                <p class="t-rotulo">${rotuloP} · ${abertas.length} NCs abertas no período</p>
            </section>
            <section class="cartao-s mudou"><div class="cab-cartao"><h2 class="t-secao et">${ic("atividade")} O que mudou: ${rotuloP.toLowerCase()}</h2><span class="t-rotulo">Atualizado hoje</span></div>
                <p><span class="ic-lado">${ic("alerta")}</span><span>${atrasados.length ? `${atrasados.length} ${atrasados.length === 1 ? "item está atrasado" : "itens estão atrasados"}: o pior é a ${atrasados[0].codigo}, com ${esc(nomeDe(atrasados[0].resp[0]))}.` : "Nenhum item atrasado."}</span></p>
                <p><span class="ic-lado">${ic("ok")}</span><span>A eficácia das verificações está em ${eficacia}% (${conta("EFICAZ")} de ${ves.length}).</span></p>
                <p><span class="ic-lado">${ic("ncs")}</span><span>${barras[0] ? `${esc(barras[0][0])} tem mais NCs abertas: ${barras[0][1]} de ${abertas.length}.` : "Nenhuma NC aberta."}</span></p></section>
            <div class="relatorios">
                ${col("NCs abertas", "rel-abertas", abertas.length, `de ${ncs.length} no período`, `<div class="abas-mini">${[["setor", "Por setor"], ["origem", "Por origem"]].map(([k, n]) => `<button data-acao="rel-dim" data-id="${k}" aria-pressed="${dim === k}">${n}</button>`).join("")}</div>
                    <div class="barras">${barras.map(([s, n]) => `<div class="barra-linha"><div class="cab-cartao"><span>${esc(s)}</span><span class="t-apoio num">${n} · ${pct(n, abertas.length)}%</span></div><span class="barra"><i style="width:${(n / maior) * 100}%"></i></span></div>`).join("")}</div>`)}
                ${col("Tempo médio até fechar", "", `${media(fechadas)} dias`, `${fechadas.length} NCs fechadas no período`, `<div class="dados">${linhaDado("Classificação Maior", `${media(fechadas.filter((nc) => gravidade(nc) === "Maior"))} dias`)}${linhaDado("Classificação Menor", `${media(fechadas.filter((nc) => gravidade(nc) === "Menor"))} dias`)}</div>
                    ${grafico([{ v: SERIE_MAIOR }, { v: SERIE_MENOR, tracejada: true }], ultimos.filter((_, i) => i % 2 === 0))}<div class="legenda t-rotulo"><span class="et"><i class="traco"></i>Maior</span><span class="et"><i class="traco tracejado"></i>Menor</span></div>`)}
                ${col("Ações e verificações atrasadas", "rel-vencidas", atrasados.length, "com o prazo vencido", `<div class="linhas">${atrasados.map((r) => `<button class="atrasado" data-acao="abrir" data-id="${r.id}"><span class="corpo"><span class="num">${r.codigo}</span><span class="t-rotulo">${esc(nomeDe(r.resp[0]))}</span></span><span class="alerta t-apoio">${ic("alerta", "p")}${-diasAte(r.campos.prazo)} ${diasAte(r.campos.prazo) === -1 ? "dia" : "dias"}</span></button>`).join("") || '<p class="t-apoio">Nenhum.</p>'}</div>`)}
                ${col("Eficácia das verificações", "", `${eficacia}%`, `${conta("EFICAZ")} de ${ves.length} verificações`, `<div class="pilha" aria-hidden="true">${Object.keys(RESULTADOS).filter((k) => conta(k)).map((k) => `<i class="${k.toLowerCase()}" style="flex:${conta(k)}"></i>`).join("")}</div>
                    <div class="legenda-col">${Object.entries(RESULTADOS).map(([k, nome]) => `<div class="cab-cartao"><span class="et"><i class="ponto-leg ${k.toLowerCase()}"></i>${nome}</span><span class="t-apoio num">${conta(k)} · ${pct(conta(k), ves.length)}%</span></div>`).join("")}</div>
                    <h3 class="t-secao" style="margin-top:8px">Reincidência</h3><button class="link-sec" style="justify-self:start" data-acao="rel-abertas">NCs reabertas: ${ncs.filter((nc) => nc.reaberta).length} ${ic("direita", "p")}</button>`)}
            </div>
            <div class="folga-barra"></div>
        </main>${navegacao("relatorios")}`;
    }

    // ─── T-09 a T-12 Administração: a lista estreita à esquerda e o painel largo à direita (Figma, T-09) ──
    const DESCRICAO_PAPEL = { VISUALIZADOR: "Vê as NCs, sem editar", EDITOR: "Registra e trabalha nas NCs", APROVADOR: "Classifica, aprova e verifica", GERENTE: "Cancela, reatribui e vê os relatórios", ADMIN: "Cuida das contas, dos papéis e dos setores" };
    function listaUsuarios() {
        const termo = (E.termoAdmin || "").trim().toLowerCase();
        const filtro = E.filtroAdmin || "Todos";
        const lista = E.pessoas.filter((p) => (filtro === "Ativos" ? p.ativo : filtro === "Inativos" ? !p.ativo : true)).filter((p) => !termo || p.nome.toLowerCase().includes(termo) || p.email.includes(termo));
        return `<div class="lista-adm">
            <div class="cab-pagina"><div><h1 class="t-pagina">Usuários</h1><p class="t-apoio num">${E.pessoas.filter((p) => p.ativo).length} ativos · ${E.pessoas.filter((p) => !p.ativo).length} inativos</p></div><button class="btn btn-pri" data-acao="novo-usuario">${ic("criar")}Novo usuário</button></div>
            <label class="busca">${ic("busca")}<span class="sr">Nome ou e-mail</span><input id="busca-adm" type="search" placeholder="Nome ou e-mail" value="${esc(E.termoAdmin || "")}" autocomplete="off"></label>
            <div class="chips-adm">${["Todos", "Ativos", "Inativos"].map((f) => `<button class="chip" data-acao="filtro-adm" data-id="${f}" aria-pressed="${filtro === f}">${f}</button>`).join("")}</div>
            <div class="cartoes">${lista
                .map(
                    (p) => `<button class="pessoa-adm" data-acao="sel-usuario" data-id="${p.sigla}" aria-current="${E.adminSel === p.sigla}">${av(p.sigla, "m")}<span class="corpo"><span class="${p.ativo ? "" : "t-apoio"}">${esc(p.nome)}</span><span class="t-rotulo">${esc(p.setor)} · ${p.papeis.map((x) => NOME_PAPEL[x]).join(", ") || "Sem papel"}</span></span>${p.ativo ? (p.convite ? '<span class="tag">Convite</span>' : "") : `${pilula("Inativo")}`}</button>`,
                )
                .join("")}</div>
            <p class="t-rotulo">Mostrando ${lista.length} de ${E.pessoas.length}</p></div>`;
    }
    function telaUsuarios() {
        if (!desk) return `<main class="pad">${listaUsuarios()}<div class="folga-barra"></div></main>${navegacao("usuarios")}`;
        return `<main class="pc"><div class="lista-painel">${listaUsuarios()}<div class="painel-adm">${E.adminSel ? painelUsuario() : '<section class="cartao-s vazio-painel"><p class="t-apoio">Escolha uma pessoa na lista, ou crie um usuário novo.</p></section>'}</div></div><div class="folga-barra"></div></main>${navegacao("usuarios")}`;
    }
    function telaUsuario() {
        return `<header class="barra-sup pad sem-fio"><button class="alvo" data-acao="voltar" aria-label="Voltar">${ic("voltar", "g")}</button><span class="t">${E.adminSel === "novo" ? "Novo usuário" : "Usuário"}</span><span class="alvo"></span></header>
            <main class="pad">${painelUsuario()}<div class="folga-barra"></div></main>`;
    }
    function painelUsuario() {
        const sel = E.adminSel;
        const setores = (v) => `<select id="u-setor">${SETORES_ATIVOS().map((s) => `<option ${s === v ? "selected" : ""}>${s}</option>`).join("")}</select>`;
        if (sel === "novo")
            return `<form class="cartao-s" id="form-usuario" novalidate><h2 class="t-secao">Novo usuário</h2>
                ${E.erroAdmin ? `<div class="aviso" role="alert">${ic("alerta")}<span>${esc(E.erroAdmin)}</span></div>` : ""}
                <div class="grade-2"><div class="campo"><label for="u-nome">Nome</label><input id="u-nome" placeholder="Nome e sobrenome"></div>
                <div class="campo"><label for="u-email">E-mail</label><input id="u-email" type="email" placeholder="nome@empresa.com.br"></div></div>
                <div class="campo"><label for="u-setor">Setor</label>${setores("Produção")}</div>
                <fieldset class="papeis"><legend class="et">${ic("escudo", "p")}Papéis</legend>${Object.entries(NOME_PAPEL).map(([k, nome]) => `<label class="papel-linha"><span class="corpo"><span>${nome}</span><span class="t-rotulo">${DESCRICAO_PAPEL[k]}</span></span><input class="interruptor" type="checkbox" name="papel" value="${k}" ${k === "EDITOR" ? "checked" : ""}></label>`).join("")}</fieldset>
                <button class="btn btn-pri" style="justify-self:start" data-acao="criar-usuario">Criar e gerar o convite</button></form>`;
        if (sel?.startsWith("convite:")) {
            const p = pessoa(sel.slice(8));
            const link = `https://andon.empresa.com.br/definir-senha?token=${p.convite}`;
            return `<section class="cartao-s"><h2 class="t-secao et">${ic("ok")} ${esc(p.nome)} foi criado</h2>
                <p class="t-apoio">Envie este link para ${esc(primeiro(p.sigla))} por fora (o sistema não manda e-mail). Ele vale por 72 horas, e aparece só agora.</p>
                <div class="link-convite num" id="link-convite">${esc(link)}</div>
                <button class="btn btn-pri" style="justify-self:start" data-acao="copiar-convite" data-id="${esc(link)}">Copiar o link</button></section>`;
        }
        const p = pessoa(sel);
        if (!p) return "";
        const abertos = aprovaAbertos(p.sigla);
        const recusa = E.recusa?.sigla === p.sigla ? `<div class="aviso" role="alert">${ic("alerta")}<span class="aviso-txt"><strong>${esc(E.recusa.titulo)}</strong>${esc(E.recusa.texto)}${E.recusa.itens?.length ? `<span class="t-rotulo">0 de ${E.recusa.itens.length} trocados · um gerente troca o aprovador deles; depois, tente de novo.</span>` : ""}</span></div>` : "";
        return `<section class="cartao-s painel-pessoa">
            <div class="cab-pagina"><div class="perfil">${av(p.sigla, "xg")}<div><h2 class="t-pagina et">${esc(p.nome)} ${pilula(p.ativo ? "Ativo" : "Inativo")}</h2><p class="t-apoio">${esc(p.email)} · é o login, não muda</p></div></div>
                <div class="bloco-acoes"><button class="btn btn-sec" data-acao="reativar" data-id="${p.sigla}">Gerar novo convite</button><button class="btn btn-sec" data-acao="mais-pessoa" data-id="${p.sigla}">Mais ${ic("baixo")}</button></div></div>
            ${recusa}
            <h3 class="t-secao">Dados</h3>

            if (!reduzir || intro < 1) raf = requestAnimationFrame(quadro);
            else ultimo = 0;
        };
        function acordar() {
            if (!raf && ligado && !document.hidden) raf = requestAnimationFrame(quadro);
        }
        addEventListener(
            "pointermove",
            (e) => {
                const x = (e.clientX / Math.max(1, innerWidth)) * 2 - 1;
                const y = (e.clientY / Math.max(1, innerHeight)) * 2 - 1;
                Object.assign(ponteiro, { dentro: true, x: limitar(x, -1, 1), y: limitar(y, -1, 1) });
            },
            { passive: true },
        );
        addEventListener("blur", () => {
            ponteiro.dentro = false;
        });
        document.addEventListener("visibilitychange", () => {
            ultimo = 0;
            acordar();
        });
        new ResizeObserver(() => ligado && redimensionar()).observe(container);
        return {
            // só gira enquanto o login está na tela: fora dele, não gasta bateria
            ligar(sim) {
                if (sim === ligado) return;
                ligado = sim;
                if (sim) {
                    intro = reduzir ? 1 : 0;
                    ultimo = 0;
                    redimensionar();
                } else if (raf) {
                    cancelAnimationFrame(raf);
                    raf = 0;
                }
            },
            redesenhar: () => ligado && desenharPrisma(),
        };
    }
