<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
    :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
</style>
<title>Protótipo Andon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<!--
  Protótipo da B4 (o portão G3), ampliado em 2026-11-03 (docs/prototipo/plano-ampliacao.md): o ciclo
  inteiro da NC (J1 a J12), o login com os perfis de teste, o celular e o computador (acima de 1024 px).
  Descartável: não vira código do produto. Os tokens vêm do DESIGN.md; as regras, uma versão de bolso
  das do backend. O estado fica guardado no navegador; "Recomeçar o protótipo" (aba Eu) zera tudo.
-->
<style>
    /* O celular, uma coluna de 430 px no máximo; os tokens do DESIGN.md §2 */
    :root {
        --pagina: #f7f7f8;
        --card: #ffffff;
        --selecao: #ececef;
        --texto: #121214;
        --apoio: #68686d;
        --borda: #e6e6ea;
        --controle: #8a8a8f;
        --primaria: #121214;
        --primaria-texto: #ffffff;
        --destrutiva: #d12e2e;
        --rascunho: #68686d;
        --aberta: #2e6fe0;
        --aprovacao: #7c4fe0;
        --fechada: #16883f;
        --breve: #975700;
        --vencida: #d12e2e;
        --veu: rgb(18 18 20 / 0.32);
        --brilho-op: 0.32;
        --brilho-modo: normal;
        --transl: 70%;
        --fio-op: 0.25;
        --fonte: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --pagina: #09090b;
            --card: #121214;
            --selecao: #25252a;
            --texto: #ececef;
            --apoio: #a1a1aa;
            --borda: #25252a;
            --controle: #68686d;
            --primaria: #ececef;
            --primaria-texto: #09090b;
            --destrutiva: #ff7b73;
            --rascunho: #a1a1aa;
            --aberta: #6aa6ff;
            --aprovacao: #ae92ff;
            --fechada: #4cd486;
            --breve: #f5b83d;
            --vencida: #ff7b73;
            --veu: rgb(0 0 0 / 0.55);
            --brilho-op: 0.6;
            --brilho-modo: screen;
            --transl: 55%;
            --fio-op: 0.45;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --pagina: #09090b;
        --card: #121214;
        --selecao: #25252a;
        --texto: #ececef;
        --apoio: #a1a1aa;
        --borda: #25252a;
        --controle: #68686d;
        --primaria: #ececef;
        --primaria-texto: #09090b;
        --destrutiva: #ff7b73;
        --rascunho: #a1a1aa;
        --aberta: #6aa6ff;
        --aprovacao: #ae92ff;
        --fechada: #4cd486;
        --breve: #f5b83d;
        --vencida: #ff7b73;
        --veu: rgb(0 0 0 / 0.55);
        --brilho-op: 0.6;
        --brilho-modo: screen;
        --transl: 55%;
        --fio-op: 0.45;
        color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--pagina);
        color: var(--texto);
        font: 400 14px/20px var(--fonte);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; border-radius: 6px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { text-wrap: balance; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    #app { max-width: 430px; min-height: 100%; margin-inline: auto; position: relative; background: var(--pagina); overflow-x: clip; }
    @media (min-width: 520px) { #app { border-inline: 1px solid var(--borda); } }
    .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

    /* Tipos (DESIGN.md §2.4) */
    .t-pagina { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
    .t-secao { font-size: 16px; line-height: 24px; font-weight: 600; }
    .t-apoio { font-size: 13px; line-height: 18px; color: var(--apoio); }
    .t-rotulo { font-size: 12px; line-height: 16px; color: var(--apoio); }
    .t-longo { font-size: 16px; line-height: 24px; }
    .num { font-variant-numeric: tabular-nums; }

    /* o traço fica em 1,5 px na tela, em qualquer tamanho do ícone (o Lucide desenha em 24 px com traço 2;
       encolhido para 12 ou 16 px, o traço caía entre os pixels e borrava) */
    svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
    svg.ic * { vector-effect: non-scaling-stroke; }
    svg.ic.g { width: 20px; height: 20px; }
    svg.ic.gg { width: 24px; height: 24px; }
    svg.ic.p { width: 13px; height: 13px; }

    /* Átomos */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
    .btn-pri { background: var(--primaria); color: var(--primaria-texto); }
    .btn-sec { background: var(--card); border: 1px solid var(--borda); }
    .btn-des { background: var(--destrutiva); color: var(--primaria-texto); }
    .btn-bloq { background: var(--selecao); color: var(--apoio); }
    .btn[disabled] { opacity: 0.6; cursor: default; }
    .btn-full { width: 100%; }
    /* o toque vai a 44 px sem mudar o desenho (ui-ux §9): uma área invisível, centrada no botão */
    .btn, .segmentado button, .chip, .link-sec, button.check, .grupo-bt, .responder, .link { position: relative; }
    :is(.btn, .segmentado button, .chip, .link-sec, button.check, .grupo-bt, .responder, .link)::before { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }
    .estado { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--selecao); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
    .estado i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .estado svg.ic { width: 14px; height: 14px; color: var(--c); }
    .av { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--selecao); border: 1px solid var(--borda); font-size: 10px; font-weight: 600; flex: none; }
    .av.m { width: 32px; height: 32px; font-size: 12px; }
    .avs { display: flex; gap: 4px; }
    .contador { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--selecao); font-size: 12px; font-weight: 600; }
    .alerta { color: var(--vencida); display: inline-flex; align-items: center; gap: 4px; }
    .alerta svg.ic { width: 14px; height: 14px; }
    .et { display: inline-flex; align-items: center; gap: 6px; }
    .link { text-decoration: underline; text-underline-offset: 3px; }

    /* A luz da porta (DESIGN.md §2.5): só na T-03 */
    .porta { position: relative; isolation: isolate; min-height: 100%; background: var(--pagina); }
    .brilho { position: absolute; left: -110px; top: -140px; width: 460px; height: 300px; pointer-events: none; z-index: 0; opacity: var(--brilho-op); mix-blend-mode: var(--brilho-modo); }
    .brilho span { position: absolute; width: 190px; height: 160px; border-radius: 50%; filter: blur(36px); background: radial-gradient(closest-side, var(--c), transparent); }
    .porta > :not(.brilho) { position: relative; z-index: 1; }

    /* T-03 Minhas pendências */
    .saudacao { padding-top: 16px; display: grid; gap: 4px; }
    .urgente { position: relative; margin-top: 16px; border: 1px solid var(--borda); border-radius: 8px; padding: 16px; display: grid; gap: 8px; background: color-mix(in srgb, var(--card) var(--transl), transparent); }
    .urgente::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid var(--texto); opacity: var(--fio-op); pointer-events: none; -webkit-mask-image: linear-gradient(120deg, #000 0%, #000 15%, transparent 45%); mask-image: linear-gradient(120deg, #000 0%, #000 15%, transparent 45%); }
    .urgente .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .urgente .acao { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .urgente .btn { margin-top: 4px; }
    .secao-titulo { margin-top: 24px; margin-bottom: 12px; }
    .gavetas { border: 1px solid var(--borda); border-radius: 8px; background: var(--card); overflow: hidden; }
    .gaveta + .gaveta { border-top: 1px solid var(--borda); }
    .gaveta-cab { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; text-align: left; }
    .gaveta-cab .nome { flex: 1; font-weight: 500; }
    .gaveta-cab .alerta { color: var(--vencida); }
    .gaveta-cab > svg.ic:first-child { width: 20px; height: 20px; }
    .linha { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px 10px 48px; text-align: left; border-top: 1px solid var(--borda); }
    .linha .corpo { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .linha .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .linha .chev { color: var(--apoio); }
    .em-dia { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--borda); color: var(--apoio); font-size: 13px; }
    .vazio-dia { padding-block: 32px 8px; text-align: center; color: var(--apoio); }

    /* Barra inferior flutuante (celular) */
    .barra-inf { position: fixed; z-index: 20; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(100%, 430px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; pointer-events: none; }
    .abas-app { pointer-events: auto; flex: 1; display: flex; padding: 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--borda); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
    .aba-app { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 999px; font-size: 12px; color: var(--apoio); position: relative; }
    .aba-app[aria-current="page"] { background: var(--selecao); color: var(--texto); font-weight: 500; }
    .aba-app .bolha { position: absolute; top: 2px; left: calc(50% + 4px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--primaria); color: var(--primaria-texto); font-size: 10px; line-height: 16px; font-weight: 600; }
    .lupa { pointer-events: auto; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--borda); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
    .folga-barra { height: calc(110px + env(safe-area-inset-bottom, 0px)); }

    /* Cabeçalhos */
    .barra-sup { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); display: flex; align-items: center; gap: 4px; min-height: 56px; border-bottom: 1px solid var(--borda); }
    .barra-sup .t { flex: 1; font-weight: 600; font-size: 16px; }
    .barra-sup.sem-fio { border-bottom-color: transparent; }
    .alvo { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; flex: none; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }

    /* T-04 Lista de NCs */
    .btn-barra { height: 36px; padding: 0 12px; }
    .resumo-lista { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .busca { margin-top: 12px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--controle); border-radius: 6px; background: var(--card); color: var(--apoio); }
    .busca input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--texto); }
    .segmentado { margin-top: 12px; display: flex; padding: 4px; border-radius: 8px; background: var(--selecao); }
    .segmentado button { flex: 1; height: 36px; border-radius: 6px; color: var(--apoio); }
    .segmentado button[aria-pressed="true"] { background: var(--card); color: var(--texto); font-weight: 500; }
    /* a fila dos filtros corre até a borda da tela e some num esmaecido: mostra que rola para o lado */
    .chips { margin-block: 6px -6px; margin-inline: -16px; padding: 6px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
    .chips::-webkit-scrollbar { display: none; }
    .chips::after { content: ""; flex: 0 0 24px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--borda); background: var(--card); flex: none; }
    .cartoes { margin-top: 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--card); overflow: hidden; }
    .cartao { width: 100%; display: grid; gap: 4px; padding: 14px 16px; text-align: left; }
    .cartao + .cartao { border-top: 1px solid var(--borda); }
    .cartao .l1, .cartao .l3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cartao .etapa { display: inline-flex; align-items: center; gap: 6px; color: var(--apoio); font-size: 13px; }
    .cartao .nova { font-size: 12px; }
    .rodape-lista { text-align: center; padding-block: 16px; }

    /* T-05 Nova NC */
    .form { display: grid; gap: 4px; padding-top: 8px; }
    .grupo { display: grid; gap: 16px; padding-block: 16px; }
    .grupo + .grupo { border-top: 1px solid var(--borda); }
    .campo { display: grid; gap: 6px; }
    .campo label { font-weight: 500; }
    .campo input, .campo select, .campo textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--controle); border-radius: 6px; background: var(--card); font-size: 16px; line-height: 22px; }
    .campo select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--apoio) 50%), linear-gradient(135deg, var(--apoio) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    .campo textarea { min-height: 112px; resize: vertical; }
    .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--texto); outline-offset: 1px; }
    .campo .ajuda { font-size: 13px; line-height: 18px; color: var(--apoio); }
    .responsaveis { border: 1px solid var(--borda); border-radius: 8px; padding: 16px; display: grid; gap: 10px; background: var(--card); }
    .responsaveis .pessoa { display: flex; align-items: center; gap: 8px; }
    .anexo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px dashed var(--controle); border-radius: 8px; color: var(--texto); }
    .anexo input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .anexos-lista { font-size: 13px; color: var(--apoio); }
    .campo.erro input, .campo.erro select, .campo.erro textarea { border-color: var(--vencida); }
    .campo.erro .ajuda { color: var(--vencida); }
    .aviso { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--selecao); }
    .toast svg.ic { margin-top: 2px; }
    .aviso svg.ic { margin-top: 2px; color: var(--vencida); }
    .aviso.info svg.ic { color: var(--aberta); }

    /* Barra de ações fixa (rodapé) */
    .barra-acoes { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); display: flex; gap: 8px; padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-top: 1px solid var(--borda); }
    .barra-acoes .btn { flex: 1; }
    .barra-acoes .btn.estreito { flex: 0 0 auto; }
    .folga-acoes { height: calc(84px + env(safe-area-inset-bottom, 0px)); }

    /* T-06 Detalhe da NC: a capa plana, igual à dos filhos (decisão (u)) */
    .capa { background: var(--card); border-bottom: 1px solid var(--borda); border-radius: 0 0 20px 20px; padding-top: 16px; padding-bottom: 16px; display: grid; gap: 8px; }
    .capa .l1 { display: flex; justify-content: space-between; align-items: center; }
    .capa .etapa { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--apoio); font-size: 13px; }
    .capa .etapa > span { display: inline-flex; align-items: center; gap: 6px; }
    .reprovado { display: grid; gap: 4px; padding: 12px; border-radius: 8px; background: var(--selecao); margin-top: 4px; }
    .abas { display: flex; margin-top: 4px; border-bottom: 1px solid var(--borda); }
    .aba { flex: 1; height: 44px; color: var(--apoio); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .aba[aria-selected="true"] { color: var(--texto); font-weight: 500; }
    .aba[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--texto); }
    .conteudo { display: grid; gap: 12px; padding-top: 16px; }
    .cartao-s { border: 1px solid var(--borda); border-radius: 8px; background: var(--card); padding: 16px; display: grid; gap: 10px; }
    .check { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; text-align: left; }
    .check .txt { flex: 1; }
    .linhas { display: grid; }
    .linhas.pessoas { gap: 4px; }
    .check .chev { color: var(--apoio); }
    .progresso-linha { display: flex; align-items: center; gap: 8px; }
    .progresso { display: inline-flex; align-items: center; gap: 4px; }
    .progresso i { display: block; width: 12px; height: 6px; border-radius: 3px; background: var(--selecao); }
    .progresso i.ok { background: var(--texto); }
    .cab-cartao { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .link-sec { min-height: 32px; color: var(--texto); }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--selecao); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag.forte { background: var(--primaria); color: var(--primaria-texto); }
    .dados { display: grid; gap: 10px; }
    .dado { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .dado .k { color: var(--apoio); flex: 0 0 auto; max-width: 45%; }
    .dado .v { text-align: right; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
    .anexo-linha .k { color: var(--apoio); max-width: 70%; overflow-wrap: anywhere; }
    .pessoa-linha { display: flex; align-items: center; gap: 10px; min-height: 36px; }
    .pessoa-linha .txt { flex: 1; }
    .itens-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .itens-grupo { display: grid; gap: 8px; }
    .itens-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grupo-bt { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 12px; letter-spacing: 0.04em; color: var(--apoio); text-align: left; }
    .grupo-bt .tipo { text-transform: uppercase; }
    .grupo-bt .nota { letter-spacing: 0; }
    .item { width: 100%; text-align: left; border: 1px solid var(--borda); border-radius: 8px; background: var(--card); padding: 12px; display: grid; gap: 6px; }
    .item .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Feed */
    .feed { display: grid; gap: 4px; }
    .dia { font-size: 12px; color: var(--apoio); padding-top: 12px; }
    /* a linha que liga os eventos: sai de baixo do círculo e vai até o próximo */
    .evento { position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; }
    .evento::before { content: ""; position: absolute; left: 12px; top: 30px; bottom: 2px; width: 1px; background: var(--borda); }
    .feed > .dia-eventos:last-child > .evento:last-child { padding-bottom: 0; }
    .feed > .dia-eventos:last-child > .evento:last-child::before { display: none; }
    .marca { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; background: var(--selecao); color: var(--apoio); flex: none; }

    /* ─── A ampliação (2026-11-03): o login, os itens, a gestão e o computador ─── */

    /* T-01 Login, sobre o Prism (decisão (r)) */

            { ok: cts.length === 0, feito: "Nenhuma contenção pendente", falta: cts.length ? `${cts[0].codigo} ${cts[0].estado === "Em aprovação" ? "em aprovação" : "aberta"}` : "", ir: "itens" },
            { ok: !!nc.campos.riscos?.trim(), feito: "Riscos revisados", falta: "Revisar os riscos", ir: "detalhes" },
            { ok: !!nc.campos.mudancas?.trim(), feito: "Mudanças no SGQ registradas", falta: "Registrar as mudanças no SGQ", ir: "detalhes" },
            { ok: !!nc.aprovador, feito: "Aprovador definido", falta: "Definir o aprovador", ir: "detalhes" },
        ];
    }

    // O que falta para enviar (a lista do botão bloqueado, princípio 3)
    function faltas(r) {
        const c = r.campos;
        const f = [];
        const vazio = (v) => !String(v ?? "").trim();
        if (r.tipo === "NC") return checklist(r).filter((x) => !x.ok).map((x) => x.falta);
        if (r.tipo === "CL") {
            if (!c.gravidade) f.push("Escolher Maior ou Menor");
            if (vazio(c.justificativa)) f.push("Escrever a justificativa");
        }
        if (r.tipo === "CT") {
            if (vazio(c.descricao)) f.push("Descrever a contenção");
            if (!c.execucao) f.push("Dizer quando foi executada");
            if (!c.disposicao) f.push("Escolher a disposição");
        }
        if (r.tipo === "IV") {
            if (vazio(c.realProblema)) f.push("Escrever o real problema");
            if (!Object.values(c.ishikawa || {}).some((v) => !vazio(v))) f.push("Preencher o Ishikawa");
            const h = c.hipoteses || [];
            if (!h.length) f.push("Registrar ao menos uma hipótese");
            if (h.some((x) => vazio(x.desc) || vazio(x.comoVerificar) || !x.classe)) f.push("Completar as hipóteses (o como verificar e o resultado)");
            if (h.length && !h.some((x) => x.classe === "Causa direta")) f.push("Marcar uma hipótese como causa direta");
            if (vazio(c.causaDireta)) f.push("Escrever a causa direta");
            if (vazio(c.causaRaiz)) f.push("Escrever a causa raiz");
            for (const ac of filhosDe(r.nc, "AC").filter((a) => vivo(a) && a.campos.iv === r.id && !a.planoAprovado)) f.push(`Plano da ${nomeItem(ac)} ainda não aprovado`);
        }
        if (r.tipo === "AC") {
            if (vazio(c.descricao)) f.push("Descrever a ação");
            if (!c.prazo) f.push("Dar um prazo");
            if (vazio(c.instrucoes)) f.push("Escrever as instruções de verificação");
        }
        if (!r.aprovador) f.push("Definir o aprovador");
        return f;
    }
    function faltasFinalizar(r) {
        const f = [];
        if (!r.campos.execucao) f.push("Dizer quando foi executada");
        if (!String(r.campos.evidencia ?? "").trim()) f.push("Descrever a evidência");
        return f;
    }

    // As pendências de quem está logado (fluxo-app §6, T-03), montadas a partir dos itens
    function pendencias() {
        const out = [];
        const add = (grupo, r, titulo, sub, prazo, extra = {}) => out.push({ grupo, id: r.id, titulo, sub, prazo, ...extra });
        const ncTitulo = (r) => `${r.nc ? `${r.nc} · ` : ""}${R(r.nc || r.id).campos.titulo}`;
        for (const r of Object.values(E.reg)) {
            if (r.estado === "Em aprovação" && r.aprovador === E.usuario)
                add("aprovar", r, `${nomeItem(r)} · ${r.tipo === "NC" ? "Fechamento" : r.tipo === "AC" && !r.planoAprovado ? "Plano" : textoDe(r)}`, r.tipo === "NC" ? r.campos.titulo : ncTitulo(r), null, { apoio: `Enviada ${haQuanto(r.enviadoEm || r.criadoEm)}` });
            if (r.estado === "Aberta" && r.reprovacao && colab(r)) add("corrigir", r, `${nomeItem(r)} · reprovada por ${primeiro(r.reprovacao.por)}`, `“${r.reprovacao.motivo}”`, null);
            if (r.estado === "Rascunho" && colab(r)) add("rascunhos", r, r.tipo === "NC" ? "Continuar rascunho" : `${TIPOS[r.tipo].nome} em rascunho`, r.tipo === "NC" ? r.campos.titulo?.trim() || "Sem título" : ncTitulo(r), null, { apoio: "Só você vê" });
            if (tem("APROVADOR", "GERENTE") && r.estado === "Aberta" && !r.aprovador && r.tipo !== "VE")
                add("triagem", r, `${nomeItem(r)} · ${r.tipo === "NC" ? r.campos.titulo : textoDe(r)}`, `${r.tipo === "NC" ? "NC" : TIPOS[r.tipo].nome} sem aprovador · publicada ${haQuanto(r.criadoEm)}`, null);
            if (r.tipo === "AC" && r.estado === "Aberta" && r.planoAprovado && colab(r)) add("executar", r, `${r.codigo} · ${textoDe(r)}`, `Executar ação · ${r.nc}`, r.campos.prazo);
            if (r.tipo === "VE" && r.estado === "Aberta" && colab(r)) add("verificar", r, `${r.codigo} · ${textoDe(r)}`, `Verificar até ${br(r.campos.prazo).slice(0, 5)} · ${r.nc}`, r.campos.prazo);
            if (r.tipo === "NC" && r.estado === "Aberta" && colab(r) && etapaDe(r) === "Pronta para fechamento" && !r.reprovacao)
                add("fechamento", r, `${r.codigo} · ${r.campos.titulo}`, "Pronta para fechamento: enviar para a aprovação", null);
        }
        for (const m of E.mencoes.filter((x) => x.para === E.usuario)) {
            const nc = R(m.nc);
            out.push({ grupo: "mencoes", id: m.nc, titulo: `${m.nc} · ${nc.campos.titulo}`, sub: `Você foi mencionado ${haQuanto(m.ts)}`, mencao: true });
        }
        return out;
    }
    const GRUPOS = [
        { id: "aprovar", nome: "Aprovar", icone: "aprovar", papeis: ["APROVADOR", "GERENTE"] },
        { id: "corrigir", nome: "Corrigir", icone: "reprovar", papeis: ["EDITOR", "APROVADOR", "GERENTE"] },
        { id: "executar", nome: "Executar ação", icone: "acao", papeis: ["EDITOR", "GERENTE"] },
        { id: "verificar", nome: "Verificar", icone: "olho", papeis: ["APROVADOR", "GERENTE"] },
        { id: "fechamento", nome: "Enviar para fechamento", icone: "pronta", papeis: ["EDITOR", "GERENTE"] },
        { id: "triagem", nome: "Triagem", icone: "triagem", papeis: ["APROVADOR", "GERENTE"] },
        { id: "mencoes", nome: "Mencionado", icone: "arroba", papeis: ["EDITOR", "APROVADOR", "GERENTE"] },
        { id: "rascunhos", nome: "Rascunhos", icone: "rascunho", papeis: ["EDITOR", "APROVADOR", "GERENTE"] },
    ];

    // ─── As ações: o ciclo de vida (cicloVidaService, numa versão de bolso) ───────────────
    function registrar(nc, icone, texto, item = null) {
        listaDe(E.feed, nc).unshift({ ts: Date.now(), tipo: "evento", icone, texto, item, quem: E.usuario });
    }
    const quem = () => nomeDe(E.usuario);
    function gerarCodigo(tipo) {
        const n = E.seq[tipo]++;
        return `${tipo}-2026-${String(n).padStart(4, "0")}`;
    }
    function novoFilho(tipo, ncId, extra = {}) {
        const nc = R(ncId);
        const id = `R${E.seq.R++}`;
        E.reg[id] = { id, codigo: null, tipo, nc: ncId, estado: "Rascunho", resp: [E.usuario], aprovador: nc.aprovador, criadoEm: Date.now(), campos: { hipoteses: [], porques: [], ishikawa: {} }, anexos: [], ...extra };
        return id;
    }
    function publicarItem(r) {
        r.codigo = gerarCodigo(r.tipo);
        r.estado = "Aberta";
        r.criadoEm = Date.now();
        // o id muda para o código, como o item ganha o código ao publicar
        delete E.reg[r.id];
        const antigo = r.id;
        r.id = r.codigo;
        E.reg[r.id] = r;
        for (const x of Object.values(E.reg)) if (x.campos.iv === antigo) x.campos.iv = r.id;
        registrar(r.nc || r.id, "criar", `${quem()} publicou a ${r.codigo}`, r.nc ? r.id : null);
        return r.id;
    }
    function submeterItem(r) {
        r.estado = "Em aprovação";
        r.enviadoEm = Date.now();
        r.reprovacao = null;
        const o = r.tipo === "NC" ? "para fechamento" : r.tipo === "AC" ? "o plano para aprovação" : "para aprovação";
        registrar(r.nc || r.id, "enviar", r.tipo === "AC" ? `${quem()} enviou o plano da ${r.codigo} para aprovação` : `${quem()} enviou a ${r.codigo} ${o}`, r.nc ? r.id : null);
    }
    function aprovarItem(r) {
        if (r.tipo === "AC" && !r.planoAprovado) {
            // aprovar o plano volta para aberta (fecharAoAprovar: false)
            Object.assign(r, { estado: "Aberta", planoAprovado: true, reprovacao: null });
            registrar(r.nc, "feito", `${quem()} aprovou o plano da ${r.codigo}`, r.id);
            return `Plano aprovado: a ${r.codigo} pode ser executada.`;
        }
        Object.assign(r, { estado: "Fechada", fechadoEm: Date.now(), aprovadoPor: E.usuario, reprovacao: null });
        const extra = r.tipo === "CL" ? ` (${r.campos.gravidade})` : "";
        registrar(r.nc || r.id, "feito", r.tipo === "NC" ? `${quem()} aprovou o fechamento da ${r.codigo}` : `${quem()} aprovou a ${r.codigo}${extra}`, r.nc ? r.id : null);
        return r.tipo === "NC" ? `Fechamento aprovado: a ${r.codigo} está fechada.` : `${r.codigo} aprovada e fechada.`;
    }
    function reprovarItem(r, motivo) {
        Object.assign(r, { estado: "Aberta", reprovacao: { por: E.usuario, motivo, ts: Date.now() } });
        registrar(r.nc || r.id, "reprovar", `${quem()} reprovou ${r.tipo === "NC" ? "o fechamento da " : r.tipo === "AC" && !r.planoAprovado ? "o plano da " : "a "}${r.codigo}: “${motivo}”`, r.nc ? r.id : null);
    }
    function retirarItem(r) {
        r.estado = "Aberta";
        registrar(r.nc || r.id, "voltar2", `${quem()} retirou a ${r.codigo} da aprovação`, r.nc ? r.id : null);
    }
    function cancelarItem(r, motivo) {
        r.estado = "Cancelada";
        registrar(r.nc || r.id, "reprovar", `${quem()} cancelou a ${r.codigo}: “${motivo}”`, r.nc ? r.id : null);
    }
    function reabrirNC(nc, motivo) {
        Object.assign(nc, { estado: "Aberta", reaberta: true, reprovacao: null });
        registrar(nc.id, "voltar2", `${quem()} reabriu a ${nc.codigo}: “${motivo}”`);
    }
    function finalizarAC(r, dias) {
        Object.assign(r, { estado: "Fechada", fechadoEm: Date.now() });
        const id = gerarCodigo("VE");
        E.reg[id] = { id, codigo: id, tipo: "VE", nc: r.nc, estado: "Aberta", resp: [r.aprovador], aprovador: null, criadoEm: Date.now(), campos: { ac: r.id, iv: r.campos.iv, prazo: iso(-dias), instrucoes: r.campos.instrucoes }, anexos: [] };
        registrar(r.nc, "acao", `${quem()} finalizou a ${r.codigo}; a ${id} nasceu para ${nomeDe(r.aprovador)}`, r.id);
        return id;
    }
    function concluirVE(r) {
        const c = r.campos;
        Object.assign(r, { estado: "Fechada", fechadoEm: Date.now() });
        registrar(r.nc, "feito", `${quem()} concluiu a ${r.codigo}: ${RESULTADOS[c.resultado].toLowerCase()}`, r.id);
        if (c.resultado === "PARCIAL") {
            // uma ação nova, na mesma investigação, com os mesmos colaboradores (B6)
            const ac = R(c.ac);
            const id = novoFilho("AC", r.nc, { resp: [...ac.resp], aprovador: ac.aprovador });
            Object.assign(R(id).campos, { iv: c.iv, descricao: "" });
            registrar(r.nc, "criar", `Uma ação nova nasceu em rascunho para ${ac.resp.map(nomeDe).join(" e ")}`, id);
            return `${r.codigo} concluída. Uma ação nova nasceu em rascunho para ${ac.resp.map(primeiro).join(" e ")}.`;
        }
        if (c.resultado === "NAO") {
            // reabre só o que estiver fechado (B4)
            const iv = R(c.iv);
            const nc = R(r.nc);
            const reabertos = [];
            if (iv?.estado === "Fechada") {
                iv.estado = "Aberta";
                reabertos.push(iv.codigo);
            }
            if (nc.estado === "Fechada") {
                Object.assign(nc, { estado: "Aberta", reaberta: true });
                reabertos.push(nc.codigo);
            }
            if (reabertos.length) registrar(r.nc, "voltar2", `A verificação não eficaz reabriu ${reabertos.join(" e ")}`, r.id);
            return `${r.codigo} concluída. ${reabertos.length ? `${reabertos.join(" e ")} ${reabertos.length > 1 ? "foram reabertas" : "foi reaberta"}.` : ""}`;
        }
        return `${r.codigo} concluída: a ação foi eficaz.`;
    }
    // ─── O estado, guardado no navegador: recarregar a página não apaga o teste ─────────────
    function carregar() {
        try {
            const s = JSON.parse(localStorage.getItem("andon-estado"));
            if (s?.versao === 2) return s;
        } catch {}
        return estadoInicial();
    }
    function guardar() {
        try {
            localStorage.setItem("andon-estado", JSON.stringify(E));
        } catch {}
    }
    let E = carregar();
    const app = document.getElementById("app");

    // O computador: acima de 1024 px, a doca, as tabelas e as colunas (ui-ux §6.1)
    const mq = matchMedia("(min-width: 1024px)");
    let desk = mq.matches;
    mq.addEventListener("change", () => {
        desk = mq.matches;
        desenhar();
    });

    // ─── Navegação ────────────────────────────────────────────────────────────────────
    // O voltar do aparelho passa pelo histórico do navegador: cada tela é um passo, e um passo de
    // reserva no começo segura o colega dentro do protótipo.
    let comHistorico = true;
    function empilhar() {
        try {
            history.pushState(null, "");
        } catch {
            comHistorico = false;
        }
    }
    function ir(tela, extra = {}) {
        E.historico.push({ tela: E.tela, ncId: E.ncId, itemId: E.itemId, aba: E.aba });
        empilhar();
        Object.assign(E, { tela, folha: null, painelAtividade: null, faixaAberta: null }, extra);
        desenhar(true);
    }
    let voltandoPeloApp = false;
    function voltar() {
        if (comHistorico && E.historico.length) {
            voltandoPeloApp = true;
            history.back();
        } else voltarNaTela();
    }
    function voltarNaTela() {
        const peloAparelho = !voltandoPeloApp;
        voltandoPeloApp = false;
        if (peloAparelho && E.folha) {
            empilhar();
            E.folha = null;
            desenhar();
            return;
        }
        if (peloAparelho && E.tela === "nova" && temConteudo(lerForm())) {
            empilhar();
            E.form = lerForm();
            E.folha = { tipo: "sair" };
            desenhar();
            return;
        }
        const ant = E.historico.pop();
        if (!ant) empilhar();
        Object.assign(E, ant || { tela: telaInicial(), ncId: null, itemId: null, aba: "resumo" });
        desenhar(true);
    }
    empilhar();
    window.addEventListener("popstate", voltarNaTela);
    function trocarAba(tela) {
        E.historico = [];
        Object.assign(E, { tela, ncId: null, itemId: null, aba: "resumo", folha: null, painelAtividade: null, faixaAberta: null });
        desenhar(true);
    }
    // A tela inicial pelo papel (fluxo-app §3)
    function telaInicial() {
        if (tem("EDITOR", "APROVADOR")) return "pendencias";
        if (tem("GERENTE")) return "relatorios";
        if (tem("VISUALIZADOR")) return "ncs";
        return "usuarios";
    }
    function abrir(id) {
        const r = R(id);
        if (!r) return;
        if (r.tipo === "NC" && r.estado === "Rascunho") return ir("nova", { form: { ...r.campos, editId: r.id, resp: r.resp }, erros: {} });
        if (r.tipo === "NC") return ir("nc", { ncId: id, aba: "resumo" });
        ir("item", { itemId: id, ncId: r.nc });
    }

    function avisar(texto, icone = "ok") {
        const area = document.getElementById("avisos");
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `${ic(icone)}<span>${esc(texto)}</span>`;
        area.appendChild(el);
        setTimeout(() => el.remove(), 4600);
    }
    const foraDoTeste = () => avisar("Esta parte fica fora do protótipo.", "info");

    // ─── Peças ────────────────────────────────────────────────────────────────────────
    const ESTADOS = {
        Aberta: { c: "var(--aberta)" },
        "Em aprovação": { c: "var(--aprovacao)", icone: "ampulheta" },
        Fechada: { c: "var(--fechada)", icone: "feito" },
        Rascunho: { c: "var(--rascunho)", icone: "pendente" },
        Cancelada: { c: "var(--rascunho)", icone: "reprovar" },
        Ativo: { c: "var(--fechada)" },

    const av = (s, cls = "") => `<span class="av ${cls}" title="${esc(nomeDe(s))}">${esc(s)}</span>`;
    const avatares = (siglas) => `<span class="avs">${siglas.map((s) => av(s)).join("")}</span>`;
    const etapa = (nome) => `<span class="et">${ic(ETAPAS[nome] || "info")}${esc(nome)}</span>`;
    const prazoTag = (d) => (d ? `<span class="prazo ${nivelPrazo(d)}">${nivelPrazo(d) ? ic("alerta", "p") : ic("relogio", "p")}${esc(prazoTexto(d))}</span>` : "");
    const indicadoresHtml = (nc) => indicadores(nc).map((i) => (i.alerta ? `<span class="alerta">${ic("alerta")}${esc(i.texto)}</span>` : `<span>· ${esc(i.texto)}</span>`)).join("");
    const voce = (s) => (s === E.usuario ? `${nomeDe(s)} (você)` : nomeDe(s));

    function navegacao(ativa) {

        const itens = [];

        if (negocio() || tem("VISUALIZADOR")) itens.push(["ncs", "NCs", "ncs"]);
        if (desk && tem("GERENTE")) itens.push(["relatorios", "Relatórios", "grafico"]);
        if (tem("ADMIN")) itens.push(["usuarios", "Usuários", "usuarios"], ["setores", "Setores", "setor"]);

        const aba = ([id, nome, icone, qtd]) =>
            {

        return `<nav class="barra-inf ${desk ? "doca" : ""}" aria-label="Navegação">
            <div class="abas-app">${desk && busca ? `<button class="aba-app busca-doca" data-acao="lupa">${ic("busca", "g")}<span>Buscar</span></button>` : ""}${itens.map(aba).join("")}
                ${desk ? `<button class="aba-app pessoa-doca" data-acao="aba-app" data-tela="eu" ${ativa === "eu" ? 'aria-current="page"' : ""} aria-label="Minha conta">${av(E.usuario)}${ic("cima", "p")}</button>` : ""}
            </div>
            ${!desk && busca && ativa !== "eu" ? `<button class="lupa" data-acao="lupa" aria-label="Buscar">${ic("busca", "gg")}</button>` : ""}
        </nav>`;
    }
    const BRILHO = `<div class="brilho" aria-hidden="true">
        <span style="--c:#ff5e7e;left:0;top:0"></span><span style="--c:#ffb547;left:55px;top:22px"></span>
        <span style="--c:#7cf29a;left:110px;top:44px"></span><span style="--c:#4fd8f0;left:165px;top:66px"></span>
        <span style="--c:#5b7cff;left:220px;top:88px"></span><span style="--c:#c86bff;left:270px;top:110px"></span></div>`;

    // ─── T-01 Login, com os perfis do protótipo ──────────────────────────────────────
    function telaLogin() {

        return `<main class="login ${prisma ? "" : "porta"} pad">

                </form>
