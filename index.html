                if (!m) break;
                reabrirNC(R(f.id), m);
                E.folha = null;
                desenhar();
                avisar(`${f.id} reaberta.`);
                break;
            }
            case "finalizar":
                abrirFolha({ tipo: "finalizar", id, dias: 30 });
                break;
            case "confirmar-finalizar": {
                const ve = finalizarAC(R(f.id), Number(f.dias) || 30);
                E.folha = null;
                desenhar();
                avisar(`Execução finalizada. A ${ve} nasceu para ${nomeDe(R(ve).resp[0])}.`);
                break;
            }
            case "concluir": {
                const c = r.campos;
                const falta = [!c.resultado && "Escolher o resultado", !String(c.conclusao ?? "").trim() && "Escrever a conclusão", !c.data && "Dizer quando verificou"].filter(Boolean);
                if (falta.length) return abrirFolha({ tipo: "faltas", titulo: "Para concluir, falta:", lista: falta });
                abrirFolha({ tipo: "concluir", id });
                break;
            }
            case "confirmar-concluir": {
                const msg = concluirVE(R(f.id));
                E.folha = null;
                desenhar();
                avisar(msg);
                break;
            }
            case "valor":
                r.campos[alvo.dataset.campo] = alvo.dataset.valor;
                desenhar();
                break;
            case "data-rapida":
                r.campos[alvo.dataset.campo] = iso(Number(alvo.dataset.dias));
                desenhar();
                break;
            case "painel-atividade":
                E.painelAtividade = { item: null };
                desenhar();
                break;
            case "fechar-painel":
                Object.assign(E, { painelAtividade: null, faixaAberta: null });
                desenhar();
                break;
            case "filtro-atividade":
                E.filtroAtividade = id;
                desenhar();
                break;
            case "painel-tudo":
                E.painelAtividade = { item: null };
                desenhar();
                break;
            case "faixa":
                E.faixaAberta = E.faixaAberta === id ? null : id;
                desenhar();
                break;
            case "rel-dim":
                E.relDim = id;
                desenhar();
                break;
            case "filtro-adm":
                E.filtroAdmin = id;
                desenhar();
                break;
            case "papel": {
                const pp = pessoa(id);
                const k = alvo.dataset.papel;
                if (!pp.papeis.includes(k)) {
                    pp.papeis.push(k);
                    E.recusa = null;
                    desenhar();
                    avisar(`${pp.nome} agora é ${NOME_PAPEL[k].toLowerCase()}. Vale na próxima ação.`);
                } else abrirFolha({ tipo: "tirar-papel", sigla: id, papel: k });
                break;
            }
            case "confirmar-papel": {
                const pp = pessoa(f.sigla);
                const resto = pp.papeis.filter((x) => x !== f.papel);
                const abertos = aprovaAbertos(f.sigla);
                E.folha = null;
                if ((f.papel === "APROVADOR" || f.papel === "GERENTE") && !resto.some((x) => x === "APROVADOR" || x === "GERENTE") && abertos.length)
                    E.recusa = { sigla: f.sigla, titulo: `Não dá para tirar o papel de ${NOME_PAPEL[f.papel].toLowerCase()} de ${primeiro(f.sigla)}`, texto: ` ${primeiro(f.sigla)} aprova ${abertos.length} ${abertos.length === 1 ? "item aberto" : "itens abertos"} (a lista embaixo).`, itens: abertos };
                else if (f.papel === "ADMIN" && E.pessoas.filter((x) => x.ativo && x.papeis.includes("ADMIN")).length === 1) E.recusa = { sigla: f.sigla, titulo: "Este é o único administrador", texto: " Dê o papel a outra pessoa antes." };
                else {
                    pp.papeis = resto;
                    E.recusa = null;
                    avisar(`${pp.nome} não é mais ${NOME_PAPEL[f.papel].toLowerCase()}.`);
                }
                desenhar();
                break;
            }
            case "mais-pessoa":
                abrirFolha({ tipo: "mais-pessoa", sigla: id });
                break;
            case "minhas-ncs":
                trocarAba("ncs");
                E.filtro = "Minhas";
                desenhar();
                break;
            case "salvar-envio":
                avisar("Salvo.");
                break;
            // pessoas e aprovador
            case "pessoas":
                abrirFolha({ tipo: "pessoas", id });
                break;
            case "escolher-pessoa":
                if (f.form) E.form.resp = [...(E.form.resp || [E.usuario]), id];
                else {
                    R(f.id).resp.push(id);
                    registrar(R(f.id).nc || f.id, "criar", `${quem()} adicionou ${nomeDe(id)} como responsável`, R(f.id).nc ? f.id : null);
                }
                E.folha = null;
                desenhar();
                break;
            case "aprovador":
                abrirFolha({ tipo: "aprovador", id });
                break;
            case "escolher-aprovador": {
                const alvoA = R(f.id);
                alvoA.aprovador = id;
                if (alvoA.tipo === "NC") for (const x of filhosDe(alvoA.id)) if (!x.aprovador && x.tipo !== "VE" && x.estado !== "Fechada" && x.estado !== "Cancelada") x.aprovador = id;
                registrar(alvoA.nc || alvoA.id, "triagem", `${quem()} definiu ${nomeDe(id)} como aprovador${alvoA.tipo === "NC" ? "" : ` da ${nomeItem(alvoA)}`}`, alvoA.nc ? alvoA.id : null);
                E.folha = null;
                desenhar();
                avisar(`${nomeDe(id)} aprova ${alvoA.tipo === "NC" ? "a NC e os itens dela" : "o item"}.`);
                break;
            }
            // a investigação
            case "hipotese":
                abrirFolha({ tipo: "hipotese", id, indice: Number(alvo.dataset.indice) });
                break;
            case "salvar-hipotese": {
                const h = { desc: document.getElementById("h-desc").value.trim(), num: document.getElementById("h-num").value.trim(), comoVerificar: document.getElementById("h-como").value.trim(), classe: document.getElementById("h-classe").value };
                if (!h.desc) {
                    document.getElementById("h-desc").focus();
                    return avisar("Escreva a hipótese.", "info");
                }
                const lista = [...(R(f.id).campos.hipoteses || [])];
                if (f.indice >= 0) lista[f.indice] = h;
                else lista.push(h);
                R(f.id).campos.hipoteses = lista;
                if (h.classe === "Causa direta" && !String(R(f.id).campos.causaDireta ?? "").trim()) R(f.id).campos.causaDireta = h.desc;
                E.folha = null;
                desenhar();
                break;
            }
            case "remover-hipotese":
                R(f.id).campos.hipoteses = R(f.id).campos.hipoteses.filter((_, i) => i !== f.indice);
                E.folha = null;
                desenhar();
                break;
            // a atividade do item
            case "atividade":
                if (desk) {
                    E.painelAtividade = { item: id };
                    desenhar();
                } else abrirFolha({ tipo: "atividade", id });
                break;
            case "atividade-todos":
                E.folha.todos = true;
                desenhar();
                break;
            case "feed-nc":
                E.folha = null;
                ir("nc", { ncId: id, itemId: null, aba: "feed" });
                break;
            case "sugestao":
                escolherSugestao(Number(id));
                break;
            case "fechar-folha":
                E.folha = null;
                desenhar();
                break;
            // relatórios
            case "periodo":
                E.periodo = id;
                desenhar();
                break;
            case "rel-abertas":
            case "rel-vencidas":
                trocarAba("ncs");
                E.filtro = acao === "rel-vencidas" ? "Vencidas" : "Todas";
                desenhar();
                break;
            // usuários
            case "sel-usuario":
            case "novo-usuario":
            case "ver-pessoa":
                Object.assign(E, { adminSel: acao === "novo-usuario" ? "novo" : id, recusa: null, erroAdmin: "" });
                if (acao === "ver-pessoa") trocarAba("usuarios");
                if (!desk) ir("usuario");
                else desenhar();
                break;
            case "criar-usuario": {
                const nome = document.getElementById("u-nome").value.trim();
                const email = document.getElementById("u-email").value.trim();
                const papeis = [...document.querySelectorAll('input[name="papel"]:checked')].map((x) => x.value);
                E.erroAdmin = nome.split(" ").length < 2 ? "Escreva o nome e o sobrenome." : !/^\S+@\S+\.\S+$/.test(email) ? "Escreva um e-mail válido." : E.pessoas.some((p) => p.email === email) ? "Já existe uma pessoa com esse e-mail." : !papeis.length ? "Escolha ao menos um papel." : "";
                if (E.erroAdmin) return desenhar();
                const sigla = iniciais(nome);
                E.pessoas.push({ sigla, nome, email, setor: document.getElementById("u-setor").value, papeis, ativo: true, convite: Math.random().toString(36).slice(2, 14) });
                E.adminSel = `convite:${sigla}`;
                desenhar();
                break;
            }
            case "copiar-convite": {
                const ok = () => avisar("Link copiado. Ele não aparece de novo.");
                const falha = () => {
                    const el = document.getElementById("link-convite");
                    getSelection().selectAllChildren(el);
                    avisar("Selecionei o link: copie com o menu do aparelho.", "info");
                };
                try {
                    navigator.clipboard.writeText(id).then(ok, falha);
                } catch {
                    falha();
                }
                break;
            }
            case "salvar-usuario": {
                const pp = pessoa(id);
                const nome = document.getElementById("u-nome")?.value.trim() || pp.nome;
                Object.assign(pp, { nome, setor: document.getElementById("u-setor").value });
                E.recusa = null;
                desenhar();
                avisar(`${pp.nome}: dados salvos.`);
                break;
            }
            case "inativar": {
                E.folha = null;
                const abertos = aprovaAbertos(id);
                if (id === E.usuario) E.recusa = { sigla: id, titulo: "Você não pode inativar a si mesmo", texto: "Peça a outro administrador." };
                else if (abertos.length) E.recusa = { sigla: id, titulo: `Não dá para inativar ${nomeDe(id)}`, texto: `${primeiro(id)} aprova ${abertos.length} ${abertos.length === 1 ? "item aberto" : "itens abertos"}:`, itens: abertos };
                else {
                    pessoa(id).ativo = false;
                    E.recusa = null;
                    avisar(`${nomeDe(id)} inativada. Ela perdeu o acesso agora.`);
                }
                desenhar();
                break;
            }
            case "reativar":
                E.folha = null;
                Object.assign(pessoa(id), { ativo: true, convite: Math.random().toString(36).slice(2, 14) });
                E.adminSel = `convite:${id}`;
                desenhar();
                break;
            // setores
            case "aba-setores":
                Object.assign(E, { abaSetores: id, setorSel: null });
                desenhar();
                break;
            case "sel-setor":
            case "novo-setor":
                Object.assign(E, { setorSel: acao === "novo-setor" ? "novo" : id, recusa: null, erroAdmin: "" });
                if (!desk) ir("setor");
                else desenhar();
                break;
            case "criar-setor": {
                const nome = document.getElementById("s-nome").value.trim();
                E.erroAdmin = nome.length < 2 ? "Escreva o nome do setor." : E.setores.some((s) => s.nome.toLowerCase() === nome.toLowerCase()) ? "Já existe um setor com esse nome." : "";
                if (E.erroAdmin) return desenhar();
                E.setores.push({ nome, ativo: true });
                Object.assign(E, { setorSel: nome, abaSetores: "Ativos" });
                desenhar();
                avisar(`Setor ${nome} criado.`);
                break;
            }
            case "renomear-setor": {
                const nome = document.getElementById("s-nome").value.trim();
                const s = E.setores.find((x) => x.nome === id);
                if (nome.length < 2 || nome === id) break;
                for (const p of E.pessoas) if (p.setor === id) p.setor = nome;
                for (const x of Object.values(E.reg)) if (x.tipo === "NC" && x.campos.setor === id) x.campos.setor = nome;
                s.nome = nome;
                E.setorSel = nome;
                desenhar();
                avisar("Setor renomeado.");
                break;
            }
            case "desativar-setor": {
                const ativas = E.pessoas.filter((p) => p.ativo && p.setor === id);
                if (ativas.length) E.recusa = { setor: id };
                else {
                    E.setores.find((x) => x.nome === id).ativo = false;
                    Object.assign(E, { recusa: null, setorSel: null });
                    avisar(`${id} desativado.`);
                }
                desenhar();
                break;
            }
            case "reativar-setor":
                E.setores.find((x) => x.nome === id).ativo = true;
                Object.assign(E, { setorSel: null, abaSetores: "Ativos" });
                desenhar();
                avisar(`${id} reativado.`);
                break;
            default:
                foraDoTeste();
        }
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && E.folha) {
            E.folha = null;
            desenhar();
        }
        if (e.key === "Enter" && e.target.matches("tr[data-acao]")) e.target.click();
    });

    desenhar();
</script>
