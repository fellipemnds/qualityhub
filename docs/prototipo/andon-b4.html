<title>Protótipo Andon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<!--
  Protótipo da B4 (o portão G3): as três jornadas no celular, para o teste com 3 colegas.
  Descartável: não vira código do produto. Os tokens vêm do DESIGN.md; os dados, da Mockups.
  O estado fica só na memória: recarregar a página (ou "Recomeçar", na aba Eu) zera tudo.
-->
<style>
    /* O celular, uma coluna de 430 px no máximo; os tokens do DESIGN.md §2 */
    :root {
        --pagina: #fbfbfc;
        --card: #ffffff;
        --selecao: #ececef;
        --texto: #121214;
        --apoio: #68686d;
        --borda: #e6e6ea;
        --controle: #8a8a8f;
        --primaria: #121214;
        --primaria-texto: #ffffff;
        --destrutiva: #d12e2e;
        --rascunho: #68686d;
        --aberta: #2e6fe0;
        --aprovacao: #7c4fe0;
        --fechada: #16883f;
        --breve: #975700;
        --vencida: #d12e2e;
        --veu: rgb(18 18 20 / 0.32);
        --brilho-op: 0.32;
        --brilho-modo: normal;
        --transl: 70%;
        --fio-op: 0.25;
        --fonte: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --pagina: #0e0e11;
            --card: #121214;
            --selecao: #25252a;
            --texto: #ececef;
            --apoio: #a1a1aa;
            --borda: #25252a;
            --controle: #68686d;
            --primaria: #ececef;
            --primaria-texto: #09090b;
            --destrutiva: #ff7b73;
            --rascunho: #a1a1aa;
            --aberta: #6aa6ff;
            --aprovacao: #ae92ff;
            --fechada: #4cd486;
            --breve: #f5b83d;
            --vencida: #ff7b73;
            --veu: rgb(0 0 0 / 0.55);
            --brilho-op: 0.6;
            --brilho-modo: screen;
            --transl: 55%;
            --fio-op: 0.45;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --pagina: #0e0e11;
        --card: #121214;
        --selecao: #25252a;
        --texto: #ececef;
        --apoio: #a1a1aa;
        --borda: #25252a;
        --controle: #68686d;
        --primaria: #ececef;
        --primaria-texto: #09090b;
        --destrutiva: #ff7b73;
        --rascunho: #a1a1aa;
        --aberta: #6aa6ff;
        --aprovacao: #ae92ff;
        --fechada: #4cd486;
        --breve: #f5b83d;
        --vencida: #ff7b73;
        --veu: rgb(0 0 0 / 0.55);
        --brilho-op: 0.6;
        --brilho-modo: screen;
        --transl: 55%;
        --fio-op: 0.45;
        color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--pagina);
        color: var(--texto);
        font: 400 14px/20px var(--fonte);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; border-radius: 6px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { text-wrap: balance; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    #app { max-width: 430px; min-height: 100%; margin-inline: auto; position: relative; background: var(--pagina); overflow-x: clip; }
    @media (min-width: 520px) { #app { border-inline: 1px solid var(--borda); } }
    .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

    /* Tipos (DESIGN.md §2.4) */
    .t-pagina { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
    .t-secao { font-size: 16px; line-height: 24px; font-weight: 600; }
    .t-apoio { font-size: 13px; line-height: 18px; color: var(--apoio); }
    .t-rotulo { font-size: 12px; line-height: 16px; color: var(--apoio); }
    .t-longo { font-size: 16px; line-height: 24px; }
    .num { font-variant-numeric: tabular-nums; }

    /* o traço fica em 1,5 px na tela, em qualquer tamanho do ícone (o Lucide desenha em 24 px com traço 2;
       encolhido para 12 ou 16 px, o traço caía entre os pixels e borrava) */
    svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
    svg.ic * { vector-effect: non-scaling-stroke; }
    svg.ic.g { width: 20px; height: 20px; }
    svg.ic.gg { width: 24px; height: 24px; }
    svg.ic.p { width: 13px; height: 13px; }

    /* Átomos */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
    .btn-pri { background: var(--primaria); color: var(--primaria-texto); }
    .btn-sec { background: var(--card); border: 1px solid var(--borda); }
    .btn-des { background: var(--destrutiva); color: var(--primaria-texto); }
    .btn-bloq { background: var(--selecao); color: var(--apoio); }
    .btn[disabled] { opacity: 0.6; cursor: default; }
    .btn-full { width: 100%; }
    .estado { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--selecao); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
    .estado i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .estado svg.ic { width: 14px; height: 14px; color: var(--c); }
    .av { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--selecao); border: 1px solid var(--borda); font-size: 10px; font-weight: 600; flex: none; }
    .av.m { width: 32px; height: 32px; font-size: 12px; }
    .avs { display: flex; gap: 4px; }
    .contador { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--selecao); font-size: 12px; font-weight: 600; }
    .alerta { color: var(--vencida); display: inline-flex; align-items: center; gap: 4px; }
    .alerta svg.ic { width: 14px; height: 14px; }
    .et { display: inline-flex; align-items: center; gap: 6px; }
    .link { text-decoration: underline; text-underline-offset: 3px; }

    /* A luz da porta (DESIGN.md §2.5): só na T-03 */
    .porta { position: relative; isolation: isolate; min-height: 100%; background: var(--pagina); }
    .brilho { position: absolute; left: -110px; top: -140px; width: 460px; height: 300px; pointer-events: none; z-index: 0; opacity: var(--brilho-op); mix-blend-mode: var(--brilho-modo); }
    .brilho span { position: absolute; width: 190px; height: 160px; border-radius: 50%; filter: blur(36px); background: radial-gradient(closest-side, var(--c), transparent); }
    .porta > :not(.brilho) { position: relative; z-index: 1; }

    /* T-03 Minhas pendências */
    .saudacao { padding-top: 16px; display: grid; gap: 4px; }
    .urgente { position: relative; margin-top: 16px; border: 1px solid var(--borda); border-radius: 8px; padding: 16px; display: grid; gap: 8px; background: color-mix(in srgb, var(--card) var(--transl), transparent); }
    .urgente::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid var(--texto); opacity: var(--fio-op); pointer-events: none; -webkit-mask-image: linear-gradient(120deg, #000 0%, #000 15%, transparent 45%); mask-image: linear-gradient(120deg, #000 0%, #000 15%, transparent 45%); }
    .urgente .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .urgente .acao { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .urgente .btn { margin-top: 4px; }
    .secao-titulo { margin-top: 24px; margin-bottom: 12px; }
    .gavetas { border: 1px solid var(--borda); border-radius: 8px; background: var(--card); overflow: hidden; }
    .gaveta + .gaveta { border-top: 1px solid var(--borda); }
    .gaveta-cab { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; text-align: left; }
    .gaveta-cab .nome { flex: 1; font-weight: 500; }
    .gaveta-cab .alerta { color: var(--vencida); }
    .gaveta-cab > svg.ic:first-child { width: 20px; height: 20px; }
    .linha { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px 10px 48px; text-align: left; border-top: 1px solid var(--borda); }
    .linha .corpo { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .linha .titulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .linha .chev { color: var(--apoio); }
    .em-dia { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--borda); color: var(--apoio); font-size: 13px; }
    .vazio-dia { padding-block: 32px 8px; text-align: center; color: var(--apoio); }

    /* Barra inferior flutuante (celular) */
    .barra-inf { position: fixed; z-index: 20; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(100%, 430px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; pointer-events: none; }
    .abas-app { pointer-events: auto; flex: 1; display: flex; padding: 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--borda); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
    .aba-app { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 999px; font-size: 12px; color: var(--apoio); position: relative; }
    .aba-app[aria-current="page"] { background: var(--selecao); color: var(--texto); font-weight: 500; }
    .aba-app .bolha { position: absolute; top: 2px; left: calc(50% + 4px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--primaria); color: var(--primaria-texto); font-size: 10px; line-height: 16px; font-weight: 600; }
    .lupa { pointer-events: auto; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--borda); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
    .folga-barra { height: calc(110px + env(safe-area-inset-bottom, 0px)); }

    /* Cabeçalhos */
    .barra-sup { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); display: flex; align-items: center; gap: 4px; min-height: 56px; border-bottom: 1px solid var(--borda); }
    .barra-sup .t { flex: 1; font-weight: 600; font-size: 16px; }
    .barra-sup.sem-fio { border-bottom-color: transparent; }
    .alvo { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; flex: none; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }

    /* T-04 Lista de NCs */
    .btn-barra { height: 36px; padding: 0 12px; }
    .resumo-lista { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .busca { margin-top: 12px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--controle); border-radius: 6px; background: var(--card); color: var(--apoio); }
    .busca input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--texto); }
    .segmentado { margin-top: 12px; display: flex; padding: 4px; border-radius: 8px; background: var(--selecao); }
    .segmentado button { flex: 1; height: 36px; border-radius: 6px; color: var(--apoio); }
    .segmentado button[aria-pressed="true"] { background: var(--card); color: var(--texto); font-weight: 500; }
    /* a fila dos filtros corre até a borda da tela e some num esmaecido: mostra que rola para o lado */
    .chips { margin-top: 12px; margin-inline: -16px; padding-inline: 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
    .chips::-webkit-scrollbar { display: none; }
    .chips::after { content: ""; flex: 0 0 24px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--borda); background: var(--card); flex: none; }
    .cartoes { margin-top: 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--card); overflow: hidden; }
    .cartao { width: 100%; display: grid; gap: 4px; padding: 14px 16px; text-align: left; }
    .cartao + .cartao { border-top: 1px solid var(--borda); }
    .cartao .l1, .cartao .l3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cartao .etapa { display: inline-flex; align-items: center; gap: 6px; color: var(--apoio); font-size: 13px; }
    .cartao .nova { font-size: 12px; }
    .rodape-lista { text-align: center; padding-block: 16px; }

    /* T-05 Nova NC */
    .form { display: grid; gap: 4px; padding-top: 8px; }
    .grupo { display: grid; gap: 16px; padding-block: 16px; }
    .grupo + .grupo { border-top: 1px solid var(--borda); }
    .campo { display: grid; gap: 6px; }
    .campo label { font-weight: 500; }
    .campo input, .campo select, .campo textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--controle); border-radius: 6px; background: var(--card); font-size: 16px; line-height: 22px; }
    .campo select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--apoio) 50%), linear-gradient(135deg, var(--apoio) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    .campo textarea { min-height: 112px; resize: vertical; }
    .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--texto); outline-offset: 1px; }
    .campo .ajuda { font-size: 13px; line-height: 18px; color: var(--apoio); }
    .responsaveis { border: 1px solid var(--borda); border-radius: 8px; padding: 16px; display: grid; gap: 10px; background: var(--card); }
    .responsaveis .pessoa { display: flex; align-items: center; gap: 8px; }
    .anexo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px dashed var(--controle); border-radius: 8px; color: var(--texto); }
    .anexo input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .anexos-lista { font-size: 13px; color: var(--apoio); }
    .campo.erro input, .campo.erro select, .campo.erro textarea { border-color: var(--vencida); }
    .campo.erro .ajuda { color: var(--vencida); }
    .aviso { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--selecao); }
    .toast svg.ic { margin-top: 2px; }
    .aviso svg.ic { margin-top: 2px; color: var(--vencida); }
    .aviso.info svg.ic { color: var(--aberta); }

    /* Barra de ações fixa (rodapé) */
    .barra-acoes { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); display: flex; gap: 8px; padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-top: 1px solid var(--borda); }
    .barra-acoes .btn { flex: 1; }
    .barra-acoes .btn.estreito { flex: 0 0 auto; }
    .folga-acoes { height: calc(84px + env(safe-area-inset-bottom, 0px)); }

    /* T-06 Detalhe da NC: a capa plana, igual à dos filhos (decisão (u)) */
    .capa { background: var(--card); border-bottom: 1px solid var(--borda); border-radius: 0 0 20px 20px; padding-top: 16px; padding-bottom: 16px; display: grid; gap: 8px; }
    .capa .l1 { display: flex; justify-content: space-between; align-items: center; }
    .capa .etapa { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--apoio); font-size: 13px; }
    .capa .etapa > span { display: inline-flex; align-items: center; gap: 6px; }
    .reprovado { display: grid; gap: 4px; padding: 12px; border-radius: 8px; background: var(--selecao); margin-top: 4px; }
    .abas { display: flex; margin-top: 4px; border-bottom: 1px solid var(--borda); }
    .aba { flex: 1; height: 44px; color: var(--apoio); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .aba[aria-selected="true"] { color: var(--texto); font-weight: 500; }
    .aba[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--texto); }
    .conteudo { display: grid; gap: 12px; padding-top: 16px; }
    .cartao-s { border: 1px solid var(--borda); border-radius: 8px; background: var(--card); padding: 16px; display: grid; gap: 10px; }
    .check { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; text-align: left; }
    .check .txt { flex: 1; }
    .check .chev { color: var(--apoio); }
    .progresso-linha { display: flex; align-items: center; gap: 8px; }
    .progresso { display: inline-flex; align-items: center; gap: 4px; }
    .progresso i { display: block; width: 12px; height: 6px; border-radius: 3px; background: var(--selecao); }
    .progresso i.ok { background: var(--texto); }
    .cab-cartao { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .link-sec { min-height: 32px; color: var(--texto); }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--selecao); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag.forte { background: var(--primaria); color: var(--primaria-texto); }
    .dados { display: grid; gap: 10px; }
    .dado { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .dado .k { color: var(--apoio); flex: 0 0 auto; max-width: 45%; }
    .dado .v { text-align: right; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
    .anexo-linha .k { color: var(--apoio); max-width: 70%; overflow-wrap: anywhere; }
    .pessoa-linha { display: flex; align-items: center; gap: 10px; min-height: 36px; }
    .pessoa-linha .txt { flex: 1; }
    .itens-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .itens-grupo { display: grid; gap: 8px; }
    .itens-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grupo-bt { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 12px; letter-spacing: 0.04em; color: var(--apoio); text-align: left; }
    .grupo-bt .tipo { text-transform: uppercase; }
    .grupo-bt .nota { letter-spacing: 0; }
    .item { width: 100%; text-align: left; border: 1px solid var(--borda); border-radius: 8px; background: var(--card); padding: 12px; display: grid; gap: 6px; }
    .item .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Feed */
    .feed { display: grid; gap: 4px; }
    .dia { font-size: 12px; color: var(--apoio); padding-top: 12px; }
    /* a linha que liga os eventos: sai de baixo do círculo e vai até o próximo */
    .evento { position: relative; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; }
    .evento::before { content: ""; position: absolute; left: 12px; top: 30px; bottom: 2px; width: 1px; background: var(--borda); }
    .feed > .dia-eventos:last-child > .evento:last-child { padding-bottom: 0; }
    .feed > .dia-eventos:last-child > .evento:last-child::before { display: none; }
    .marca { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; background: var(--selecao); color: var(--apoio); flex: none; }
    .marca.av { border: 0; color: var(--texto); }
    .ev-txt { padding-top: 2px; }
    .responder { justify-self: start; display: inline-flex; gap: 4px; align-items: center; }
    .comentario { flex: 1; min-width: 0; border: 1px solid var(--borda); border-radius: 8px; background: var(--card); padding: 10px 12px; display: grid; gap: 4px; }
    .comentario .quem { display: flex; gap: 8px; align-items: baseline; }
    .comentario .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
    .mencao { font-weight: 600; }
    .compositor { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); background: var(--card); border-top: 1px solid var(--borda); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .compositor .linha-c { display: flex; gap: 8px; align-items: flex-end; }

                <p class="t-rotulo">Segunda, 26 de outubro</p>

            <section class="urgente" aria-label="O mais urgente">

                ${gaveta("vencidas", "alerta", "Vencidas", 1, linha("fora", "", "AC-2026-0003 · Trocar o fornecedor da junta…", "Executar ação · NC-2026-0042", '<span class="alerta">Vencido há 2 dias</span>'), true)}
                ${E.aprovacoes.length ? gaveta("aprovar", "aprovar", "Aprovar", E.aprovacoes.length, aprovar.join("")) : ""}
                ${gaveta("triagem", "triagem", "Triagem", 1, linha("fora", "", "NC-2026-0045 · Rótulo ilegível", "NC sem aprovador · publicada hoje"))}
                <div class="em-dia">${ic("ok", "g")}<span>Corrigir, Verificar e mais 3 tipos: em dia</span></div>
            </div>

        </main>${barraInferior("pendencias")}`;
    }

    // T-04 Lista de NCs
    function telaNcs() {
        const termo = E.termo.trim().toLowerCase();
        const lista = E.ordem
            .map((id) => E.ncs[id])
            .filter((nc) => (E.filtro === "Minhas" ? nc.minha : E.filtro === "Vencidas" ? !!nc.indicador : true))
            .filter((nc) => !termo || nc.codigo.toLowerCase().includes(termo) || nc.titulo.toLowerCase().includes(termo));
        const abertas = 38 + (E.seq - 46);
        const cartoes = lista
            .map(
                (nc) => `<button class="cartao" data-acao="abrir-nc" data-id="${nc.codigo}">
                    <span class="l1"><span class="t-apoio num">${nc.codigo} · ${esc(nc.setor)}</span>${pilula(nc.estado)}</span>
                    <span class="t-secao">${esc(nc.titulo)}</span>
                    ${nc.indicador ? `<span class="alerta t-apoio">${ic("alerta")}${esc(nc.indicador)}</span>` : ""}
                    <span class="l3"><span class="etapa">${etapa(nc.etapa)}</span>${avatares(nc.resp.filter((s) => s !== "BL").slice(0, 2))}</span>
                </button>`,
            )
            .join("");
        return `<header class="barra-sup pad"><h1 class="t">Não Conformidades</h1><button class="btn btn-pri btn-barra" data-acao="nova">${ic("criar")}Nova NC</button></header>
        <main class="pad">
            <div class="resumo-lista t-apoio"><span class="num">${abertas} abertas</span><span class="alerta">${ic("alerta")}3 com prazo vencido</span></div>
            <label class="busca">${ic("busca")}<span class="sr">Buscar por código ou título</span><input id="busca-ncs" type="search" placeholder="Código ou título" value="${esc(E.termo)}" autocomplete="off"></label>
            <div class="segmentado" role="group" aria-label="Quais NCs">
                ${["Todas", "Minhas", "Vencidas"].map((f) => `<button data-acao="filtro" data-id="${f}" aria-pressed="${E.filtro === f}">${f}</button>`).join("")}
            </div>
            <div class="chips">${["Etapa", "Estado", "Setor", "Origem", "Classificação"].map((c) => `<button class="chip" data-acao="fora">${c}${ic("baixo")}</button>`).join("")}</div>
            <div class="cartoes">${cartoes || '<p class="cartao t-apoio">Nenhuma NC com esse código ou título.</p>'}</div>
            <p class="rodape-lista t-apoio num">Mostrando ${lista.length} de ${abertas}</p>
            <div class="folga-barra"></div>
        </main>${barraInferior("ncs")}`;
    }

    // T-05 Nova NC
    function telaNova() {
        const f = E.form || {};
        const er = E.erros;
        const campo = (id, rotulo, html, ajuda) => `
            <div class="campo ${er[id] ? "erro" : ""}">
                <label for="f-${id}">${rotulo}</label>
                ${html}
                ${er[id] || ajuda ? `<span class="ajuda" id="a-${id}">${esc(er[id] || ajuda)}</span>` : ""}
            </div>`;
        const desc = (id) => (er[id] ? `aria-invalid="true" aria-describedby="a-${id}"` : `aria-describedby="a-${id}"`);
        const opcoes = (lista, val) => `<option value="">Escolha</option>${lista.map((o) => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}`;
        return `<header class="barra-sup pad"><button class="alvo" data-acao="fechar-nova" aria-label="Fechar">${ic("x", "gg")}</button><span class="t">${f.deRascunho ? "Rascunho" : "Nova NC"}</span></header>
        <main class="pad">
            <form class="form" id="form-nova" novalidate>
                ${E.erroGeral ? `<div class="aviso" role="alert">${ic("alerta")}<span>${esc(E.erroGeral)}</span></div>` : ""}
                <div class="grupo">
                    <h2 class="t-secao">O que aconteceu</h2>
                    ${campo("titulo", "Título", `<input id="f-titulo" name="titulo" maxlength="200" placeholder="Ex.: Vazamento na linha 3" value="${esc(f.titulo)}" ${desc("titulo")}>`, "Pelo menos 5 caracteres")}
                    ${campo("descricao", "Descrição", `<textarea id="f-descricao" name="descricao" placeholder="O que aconteceu, onde e quando" ${desc("descricao")}>${esc(f.descricao)}</textarea>`, "Pelo menos 20 caracteres: o que aconteceu, onde e quando")}
                    ${campo("data", "Detectada em", `<input id="f-data" name="data" type="date" value="${esc(f.data || "2026-10-26")}" max="2026-10-26" ${desc("data")}>`, "")}
                    ${campo("origem", "Origem", `<select id="f-origem" name="origem" ${desc("origem")}>${opcoes(ORIGENS, f.origem)}</select>`, "")}
                </div>
                <div class="grupo">
                    <h2 class="t-secao">Onde</h2>
                    ${campo("setor", "Setor", `<select id="f-setor" name="setor" ${desc("setor")}>${opcoes(SETORES, f.setor)}</select>`, "")}
                    ${campo("processo", "Processo afetado", `<input id="f-processo" name="processo" placeholder="Ex.: Montagem do cabeçote" value="${esc(f.processo)}" ${desc("processo")}>`, "")}
                    ${campo("cliente", "Cliente (opcional)", `<input id="f-cliente" name="cliente" placeholder="Nome do cliente" value="${esc(f.cliente)}">`, "")}
                </div>
                <div class="grupo">
                    <h2 class="t-secao">O que foi violado</h2>
                    ${campo("requisito", "Requisito violado", `<input id="f-requisito" name="requisito" placeholder="Ex.: IT-042, item 5.3" value="${esc(f.requisito)}" ${desc("requisito")}>`, "")}
                    <div class="responsaveis">
                        <h3 class="t-secao">Responsáveis</h3>
                        <p class="t-apoio">Quem vai trabalhar na NC. Você entra como responsável.</p>
                        <div class="pessoa"><span class="av m">FS</span>Fulana Souza (você)</div>
                        <button type="button" class="link" style="justify-self:start" data-acao="fora">+ Adicionar responsável</button>
                    </div>
                    <label class="anexo">${ic("camera", "g")}<span>Tirar foto ou anexar</span><input id="f-anexo" type="file" accept="image/*,application/pdf" multiple></label>
                    <p class="anexos-lista" id="anexos-lista">${(f.anexos || []).map((a) => esc(a.nome)).join(" · ")}</p>
                </div>
            </form>
            <div class="folga-acoes"></div>
        </main>
        <div class="barra-acoes">
            <button class="btn btn-sec" data-acao="salvar-rascunho" ${E.publicando ? "disabled" : ""}>Salvar rascunho</button>
            <button class="btn btn-pri" data-acao="publicar" ${E.publicando ? "disabled" : ""}>${E.publicando ? "Publicando…" : "Publicar"}</button>
        </div>`;
    }

    function lerForm() {
        const fd = new FormData(document.getElementById("form-nova"));
        const f = Object.fromEntries(["titulo", "descricao", "data", "origem", "setor", "processo", "cliente", "requisito"].map((k) => [k, (fd.get(k) || "").toString()]));
        f.anexos = E.form?.anexos || [];
        f.deRascunho = E.form?.deRascunho;
        return f;
    }
    const temConteudo = (f) => ["titulo", "descricao", "origem", "setor", "processo", "cliente", "requisito"].some((k) => f[k]?.trim());

    function validar(f) {
        const er = {};
        if (f.titulo.trim().length < 5) er.titulo = "Use 5 caracteres ou mais.";
        if (f.descricao.trim().length < 20) er.descricao = "Use 20 caracteres ou mais: o que aconteceu, onde e quando.";
        if (!f.data) er.data = "Diga quando foi detectada.";
        if (!f.origem) er.origem = "Escolha a origem.";
        if (!f.setor) er.setor = "Escolha o setor.";
        if (!f.processo.trim()) er.processo = "Diga o processo afetado.";
        if (!f.requisito.trim()) er.requisito = "Diga o requisito violado.";
        return er;
    }

    function publicar() {
        const f = lerForm();
        E.form = f;
        E.erros = validar(f);
        const primeiro = Object.keys(E.erros)[0];
        if (primeiro) {
            E.erroGeral = "";
            desenhar();
            document.getElementById(`f-${primeiro}`)?.focus();
            return;
        }
        E.publicando = true;
        desenhar();
        setTimeout(() => {
            const codigo = `NC-2026-${String(E.seq).padStart(4, "0")}`;
            E.seq += 1;
            const [a, m, d] = f.data.split("-");
            E.ncs[codigo] = {
                codigo,
                titulo: f.titulo.trim(),
                setor: f.setor,
                estado: "Aberta",
                etapa: "Aguardando classificação",
                resp: ["FS"],
                minha: true,
                detalhe: true,
                descricao: f.descricao.trim(),
                dados: [
                    ["Setor", f.setor],
                    ["Processo afetado", f.processo.trim()],
                    ["Origem", f.origem],
                    ["Classificação", "—"],
                    ["Detectada em", `${d}/${m}/${a}`],
                    ["Requisito violado", f.requisito.trim()],
                    ["Cliente", f.cliente.trim() || "—"],
                ],
                envio: { riscos: "—", mudancas: "—" },
                atribuicoes: [["FS", "Responsável"]],
                checklist: [
                    ["pendente", "Classificação fechada"],
                    ["pendente", "Investigação fechada"],
                    ["ok", "Nenhuma contenção pendente"],
                    ["pendente", "Riscos revisados"],
                    ["pendente", "Mudanças no SGQ"],
                    ["pendente", "Aprovador definido"],
                ],
                itens: [
                    { tipo: "Classificação", nota: "0 · quem classifica é a qualidade", lista: [] },
                    { tipo: "Contenção", nota: "0", lista: [] },
                    { tipo: "Investigação", nota: "0", lista: [] },
                    { tipo: "Ação corretiva", nota: "0 · nasce de uma investigação aberta", lista: [] },
                    { tipo: "Verificação", nota: "0 · nasce sozinha ao finalizar uma ação", lista: [] },
                ],
                feed: [{ dia: "Hoje", tipo: "evento", icone: "criar", texto: `Você publicou a ${codigo}`, hora: horaAgora() }],
                barra: "fechamento",
                anexos: f.anexos.map((a) => [a.nome, a.tamanho]),
            };
            E.ordem.unshift(codigo);
            if (f.deRascunho) E.rascunho = null;
            Object.assign(E, { form: null, erros: {}, publicando: false, erroGeral: "" });
            E.historico = [{ tela: "ncs" }];
            Object.assign(E, { tela: "nc", ncId: codigo, aba: "resumo" });
            desenhar(true);
            avisar(`${codigo} publicada. Ela aguarda a classificação da qualidade.`);
        }, 700);
    }

    const horaAgora = () => new Date().toTimeString().slice(0, 5);

    // T-06 Detalhe da NC
    function telaNc() {
        const nc = E.ncs[E.ncId];

            ["resumo", "Resumo"],
            ["detalhes", "Detalhes"],

            `<div class="dado"><span class="k">${k}</span><span class="v">${typeof v === "object" ? `<span class="tag">${esc(v.tag)}</span><span class="t-apoio num">${esc(v.codigo)}</span>` : esc(v)}</span></div>`;
        let corpo = "";
        if (E.aba === "resumo") {
            const destino = (t) => (/Riscos|Mudanças|Aprovador/.test(t) ? "detalhes" : "itens");
            corpo = `
                <section class="cartao-s"><h2 class="t-secao">Descrição</h2><p class="t-longo">${esc(nc.descricao)}</p></section>
                <section class="cartao-s"><h2 class="t-secao">Checklist de fechamento</h2>
                    <div class="progresso-linha">${segmentos(atendidos, 6)}<span class="t-apoio">·</span><span class="t-apoio num">${atendidos} de 6 atendidos</span></div>
                    ${nc.checklist
                        .map(([i, t]) =>
                            i === "ok"
                                ? `<div class="check">${ic(i, "g")}<span class="txt">${esc(t)}</span></div>`
                                : `<button class="check" data-acao="ir-aba" data-id="${destino(t)}">${ic(i, "g")}<span class="txt">${esc(t)}</span><span class="chev">${ic("direita")}</span></button>`,
                        )
                        .join("")}
                </section>
                <section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Atividade recente</h2><button class="link-sec" data-acao="ir-aba" data-id="feed">Ver tudo</button></div>
                    ${listaFeed(nc.feed.slice(0, 2), true)}
                </section>`;
        } else if (E.aba === "detalhes") {
            const funcao = (f) => `<span class="${f === "Aprovadora" ? "tag forte" : "tag"}">${f}</span>`;
            corpo = `
                <section class="cartao-s"><h2 class="t-secao">Descrição</h2><p class="t-longo">${esc(nc.descricao)}</p></section>
                <section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Dados</h2><button class="link-sec" data-acao="fora">Editar</button></div>
                    <div class="dados">${nc.dados.map(([k, v]) => linhaDado(k, v)).join("")}</div></section>
                <section class="cartao-s"><h2 class="t-secao">Envio para fechamento</h2>
                    <div class="dados">${linhaDado("Riscos revisados", nc.envio.riscos)}${linhaDado("Mudanças no SGQ", nc.envio.mudancas)}</div>
                    <p class="t-apoio">Preenchidos antes de enviar para fechamento.</p></section>
                <section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Atribuições</h2><button class="link-sec" data-acao="fora">+ Adicionar responsável</button></div>
                    ${nc.atribuicoes.map(([s, f]) => `<div class="pessoa-linha"><span class="av m">${s}</span><span class="txt">${esc(nomeDe(s).replace(" (você)", ""))}</span>${funcao(f)}</div>`).join("")}</section>
                <section class="cartao-s"><div class="cab-cartao"><h2 class="t-secao">Anexos (${nc.anexos.length})</h2><button class="link-sec" data-acao="fora">+ Anexar</button></div>
                    ${nc.anexos.length ? nc.anexos.map(([n, t]) => `<div class="dado anexo-linha"><span class="k">${esc(n)}</span><span class="v num">${esc(t)}</span></div>`).join("") : '<p class="t-apoio">Nenhum anexo.</p>'}</section>`;
        } else if (E.aba === "itens") {
            const todos = nc.itens.flatMap((g) => g.lista);
            const fechados = todos.filter((it) => it.estado === "Fechada").length;
            const temNova = ["Classificação", "Contenção", "Investigação"];
            corpo = `<div class="itens-topo"><span class="progresso-linha"><span class="t-apoio num">${fechados} de ${todos.length} fechados</span>${segmentos(fechados, todos.length)}</span><button class="btn btn-sec btn-barra" data-acao="fora">+ Novo item ${ic("baixo")}</button></div>
                ${nc.itens
                    .map((g) => {
                        const chave = `${nc.codigo}:${g.tipo}`;
                        const aberto = E.grupos[chave] ?? g.lista.some((it) => it.estado !== "Fechada");
                        const nota = g.lista.length && g.lista.every((it) => it.estado === "Fechada") ? "fechada" : g.nota;
                        return `<div class="itens-grupo">
                            <div class="itens-cab"><button class="grupo-bt" data-acao="grupo" data-id="${chave}" aria-expanded="${aberto}">${ic(aberto ? "baixo" : "direita")}<span class="tipo">${esc(g.tipo)}</span><span class="num">${g.lista.length}</span>${nota ? `<span class="nota">· ${esc(nota)}</span>` : ""}</button>${temNova.includes(g.tipo) ? '<button class="link-sec" data-acao="fora">+ Nova</button>' : ""}</div>
                            ${
                                aberto
                                    ? g.lista
                                          .map(
                                              (it) => `<button class="item" data-acao="fora"><span class="l1"><span class="t-apoio num">${it.codigo}</span><span style="display:flex;gap:6px;align-items:center">${pilula(it.estado)}<span class="av">${it.quem}</span></span></span>
                                <span>${esc(it.texto)}</span>${it.vencido ? `<span class="alerta t-apoio">${ic("alerta")}${it.vencido}</span>` : it.extra ? `<span class="t-apoio">${it.extra}</span>` : ""}</button>`,
                                          )
                                          .join("")
                                    : ""
                            }</div>`;
                    })
                    .join("")}`;
        } else {
            corpo = listaFeed(nc.feed);
        }
        const reprov = nc.reprovacao
            ? `<div class="reprovado" role="note"><span class="t-rotulo">Reprovado por você · hoje</span><span>“${esc(nc.reprovacao)}”</span></div>`
            : "";

            <div class="folga-acoes"></div>

    function barraNc(nc) {
        if (nc.barra === "decidir" && nc.estado === "Em aprovação") {
            return `<div class="barra-acoes"><button class="btn btn-sec" data-acao="reprovar">Reprovar</button><button class="btn btn-pri" data-acao="aprovar">Aprovar</button></div>`;
        }
        if (nc.barra === "fechamento" && nc.estado === "Aberta") {
            return `<div class="barra-acoes"><button class="btn btn-bloq" data-acao="bloqueado" aria-describedby="porque-bloq">Enviar para fechamento ${ic("info")}</button><button class="btn btn-sec estreito" data-acao="fora">Salvar</button><span id="porque-bloq" class="sr">Ainda faltam requisitos do checklist</span></div>`;
        }
        return "";
    }

    // O feed (o mesmo desenho na aba Feed e na Atividade recente): os eventos ligados por uma linha
    function listaFeed(eventos, curto = false) {
        let dia = "";
        const quando = (ev) => (curto ? `${ev.dia.split(",")[0]}, ${ev.hora}` : ev.hora);
        const grupos = [];
        for (const ev of eventos) {
            if (curto || ev.dia !== dia) grupos.push({ dia: ev.dia, evs: [] });
            dia = ev.dia;
            grupos.at(-1).evs.push(ev);
        }
        const evento = (ev) =>
            ev.tipo === "comentario"
                ? `<div class="evento"><span class="marca av">${ev.sigla}</span><div class="comentario"><div class="quem"><strong>${esc(ev.quem)}</strong><span class="t-rotulo num">${quando(ev)}</span></div><div class="texto">${realcar(ev.texto)}</div><button class="t-rotulo responder" data-acao="fora">${ic("responder")}Responder</button></div></div>`
                : `<div class="evento"><span class="marca">${ic(ev.icone, "p")}</span><div class="ev-txt"><div>${esc(ev.texto)}</div><div class="t-rotulo num">${quando(ev)}</div></div></div>`;
        return `<div class="feed">${grupos.map((g) => `${curto ? "" : `<p class="dia">${esc(g.dia)}</p>`}<div class="dia-eventos">${g.evs.map(evento).join("")}</div>`).join("")}</div>`;
    }
    const realcar = (t) => esc(t).replace(/(^|\s)([@#][\wÀ-ÿ-]+)/g, '$1<span class="mencao">$2</span>');

    function compositor() {
        return `<form class="compositor" id="form-comentario" novalidate>
            <div id="sugestoes"></div>
            <label for="comentario" class="sr">Comentar. Use @ para chamar uma pessoa e # para citar um item.</label>
            <div class="linha-c">
                <textarea id="comentario" rows="1" placeholder="Comentar… @ pessoa, # item" autocomplete="off">${esc(E.rascunhoComentario || "")}</textarea>
                <button class="btn btn-pri" type="submit">Comentar</button>
            </div>
        </form>`;
    }

    // As sugestões do @ e do # (sem redesenhar a tela, para o cursor não pular)
    const sug = { lista: [], ativo: 0, inicio: 0, gatilho: "" };
    function atualizarSugestoes() {
        const ta = document.getElementById("comentario");
        const caixa = document.getElementById("sugestoes");
        if (!ta || !caixa) return;
        const antes = ta.value.slice(0, ta.selectionStart);
        const m = antes.match(/(^|\s)([@#])([\wÀ-ÿ-]*)$/);
        if (!m) {
            sug.lista = [];
            caixa.innerHTML = "";
            return;
        }
        const termo = m[3].toLowerCase();
        sug.gatilho = m[2];
        sug.inicio = antes.length - m[3].length - 1;
        sug.lista =
            m[2] === "@"
                ? PESSOAS.filter((p) => p.nome.toLowerCase().split(" ").some((parte) => parte.startsWith(termo)) || p.nome.toLowerCase().startsWith(termo)).map((p) => ({ chave: p.nome.split(" ")[0], rotulo: p.nome, apoio: p.papel, sigla: p.sigla }))
                : ITENS_CODIGO.filter((i) => i.codigo.toLowerCase().includes(termo)).map((i) => ({ chave: i.codigo, rotulo: i.codigo, apoio: i.texto }));
        sug.ativo = Math.min(sug.ativo, Math.max(sug.lista.length - 1, 0));
        caixa.innerHTML = sug.lista.length
            ? `<div class="sugestoes" role="listbox" id="lista-sug" aria-label="${m[2] === "@" ? "Pessoas" : "Itens"}">
                <div class="dica">${m[2] === "@" ? "Chamar uma pessoa: ela recebe uma pendência" : "Citar um item desta NC"}</div>
                ${sug.lista.map((s, i) => `<button type="button" class="sugestao" role="option" data-acao="sugestao" data-id="${i}" aria-selected="${i === sug.ativo}">${s.sigla ? `<span class="av">${s.sigla}</span>` : ic("documento")}<span><span style="display:block">${esc(s.rotulo)}</span><span class="t-rotulo">${esc(s.apoio)}</span></span></button>`).join("")}
            </div>`
            : "";
    }
    function escolherSugestao(i) {
        const s = sug.lista[i];
        const ta = document.getElementById("comentario");
        if (!s || !ta) return;
        const fim = ta.selectionStart;
        const texto = `${ta.value.slice(0, sug.inicio)}${sug.gatilho}${s.chave} ${ta.value.slice(fim)}`;
        ta.value = texto;
        const pos = sug.inicio + s.chave.length + 2;
        ta.setSelectionRange(pos, pos);
        if (s.sigla && !E.mencionados.includes(s.rotulo)) E.mencionados.push(s.rotulo);
        sug.lista = [];
        document.getElementById("sugestoes").innerHTML = "";
        ta.focus();
    }

    function comentar() {
        const ta = document.getElementById("comentario");
        const texto = ta.value.trim();
        if (!texto) {
            ta.focus();
            return;
        }
        const nc = E.ncs[E.ncId];
        const chamados = PESSOAS.filter((p) => new RegExp(`@${p.nome.split(" ")[0]}(\\b|$)`).test(texto)).map((p) => p.nome);
        nc.feed.unshift({ dia: "Hoje", tipo: "comentario", quem: "Fulana Souza", sigla: "FS", texto, hora: horaAgora() });
        E.rascunhoComentario = "";
        E.mencionados = [];
        desenhar();
        if (chamados.length === 1) avisar(`Comentário publicado. ${chamados[0]} vai ver na pendência dele.`);
        else if (chamados.length > 1) avisar(`Comentário publicado. ${chamados.join(" e ")} vão ver na pendência.`);
        else avisar("Comentário publicado.");
    }

    // A decisão (J8)
    function aprovar() {
        const nc = E.ncs[E.ncId];
        Object.assign(nc, { estado: "Fechada", etapa: "Fechada", reprovacao: "" });
        nc.checklist = nc.checklist.map(([, t]) => ["ok", t]);
        nc.feed.unshift({ dia: "Hoje", tipo: "evento", icone: "feito", texto: `Você aprovou o fechamento da ${nc.codigo}`, hora: horaAgora() });
        E.aprovacoes = E.aprovacoes.filter((id) => id !== nc.codigo);
        desenhar();
        avisar(`Fechamento aprovado: a ${nc.codigo} está fechada.`);
    }
    function abrirReprovar() {
        E.folha = { tipo: "reprovar", erro: "", motivo: "" };
        desenhar();
        document.getElementById("motivo")?.focus();
    }
    function reprovar() {
        const motivo = document.getElementById("motivo").value.trim();
        if (!motivo) {
            E.folha.erro = "Escreva o motivo: ele vai para o Deltrano corrigir.";
            desenhar();
            document.getElementById("motivo")?.focus();
            return;
        }
        const nc = E.ncs[E.ncId];
        Object.assign(nc, { estado: "Aberta", etapa: "Pronta para fechamento", reprovacao: motivo, barra: "nenhuma" });
        nc.feed.unshift({ dia: "Hoje", tipo: "evento", icone: "reprovar", texto: `Você reprovou o fechamento da ${nc.codigo}: “${motivo}”`, hora: horaAgora() });
        E.aprovacoes = E.aprovacoes.filter((id) => id !== nc.codigo);
        E.folha = null;
        desenhar();
        avisar("Fechamento reprovado. Deltrano Alves vai ver o seu motivo.");
    }

    function folha() {
        const f = E.folha;
        if (!f) return "";
        if (f.tipo === "reprovar") {
            const nc = E.ncs[E.ncId];
            return `<div class="veu" data-acao="fechar-folha"><div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-t" data-parar>
                <span class="pega" aria-hidden="true"></span>
                <h2 class="t-secao" id="folha-t">Reprovar o fechamento da ${nc.codigo}?</h2>
                <p class="t-apoio">Ela volta para aberta, para o Deltrano Alves corrigir. O seu motivo aparece no topo da NC até o próximo envio.</p>
                <div class="campo ${f.erro ? "erro" : ""}"><label for="motivo">Motivo</label><textarea id="motivo" maxlength="5000" ${f.erro ? 'aria-invalid="true"' : ""} aria-describedby="motivo-a">${esc(f.motivo)}</textarea><span class="ajuda" id="motivo-a">${esc(f.erro || "Obrigatório. Fica no histórico, com o seu nome e a data.")}</span></div>
                <div class="botoes"><button class="btn btn-pri btn-full" data-acao="confirmar-reprovar">Reprovar</button><button class="btn btn-sec btn-full" data-acao="fechar-folha">Voltar</button></div>
            </div></div>`;
        }
        if (f.tipo === "sair") {
            return `<div class="veu" data-acao="fechar-folha"><div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-t" data-parar>
                <span class="pega" aria-hidden="true"></span>
                <h2 class="t-secao" id="folha-t">Sair sem publicar?</h2>
                <p class="t-apoio">Salve como rascunho para continuar depois. Ele fica nas suas pendências, e só você vê.</p>
                <div class="botoes"><button class="btn btn-pri btn-full" data-acao="salvar-rascunho">Salvar rascunho</button><button class="btn btn-des btn-full" data-acao="descartar">Descartar</button><button class="btn btn-sec btn-full" data-acao="fechar-folha">Voltar</button></div>
            </div></div>`;
        }
        return "";
    }

    // T-13 Eu
    function telaEu() {
        return `<main class="pad">
            <div class="perfil"><span class="av m" style="width:48px;height:48px;font-size:16px">FS</span><div><h1 class="t-secao">Fulana Souza</h1><p class="t-apoio">Responsável e aprovadora · Produção</p></div></div>
            <div class="recomecar cartao-s">
                <h2 class="t-secao">Protótipo</h2>
                <p class="t-apoio">Tudo o que você fez aqui fica só neste aparelho, até recarregar a página. Para o próximo colega começar do zero:</p>
                <button class="btn btn-sec" data-acao="recomecar">Recomeçar o protótipo</button>
            </div>
            <div class="folga-barra"></div>
        </main>${barraInferior("eu")}`;
    }

    // Desenhar
    function desenhar(rolarTopo = false) {
        const telas = { pendencias: telaPendencias, ncs: telaNcs, nova: telaNova, nc: telaNc, eu: telaEu };
        app.innerHTML = telas[E.tela]() + folha();
        if (rolarTopo) window.scrollTo(0, 0);
        if (E.tela === "nc" && E.aba === "feed") {
            const ta = document.getElementById("comentario");
            ta?.addEventListener("input", () => {
                E.rascunhoComentario = ta.value;
                ta.style.height = "auto";
                ta.style.height = `${Math.min(ta.scrollHeight, 140)}px`;
                atualizarSugestoes();
            });
            ta?.addEventListener("click", atualizarSugestoes);
            ta?.addEventListener("keydown", (e) => {
                if (!sug.lista.length) return;
                if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    sug.ativo = (sug.ativo + (e.key === "ArrowDown" ? 1 : -1) + sug.lista.length) % sug.lista.length;
                    atualizarSugestoes();
                } else if (e.key === "Enter" || e.key === "Tab") {
                    e.preventDefault();
                    escolherSugestao(sug.ativo);
                } else if (e.key === "Escape") {
                    sug.lista = [];
                    document.getElementById("sugestoes").innerHTML = "";
                }
            });
            document.getElementById("form-comentario")?.addEventListener("submit", (e) => {
                e.preventDefault();
                comentar();
            });
        }
        if (E.tela === "nova") {
            document.getElementById("form-nova")?.addEventListener("submit", (e) => e.preventDefault());
            document.getElementById("f-anexo")?.addEventListener("change", (e) => {
                const tamanho = (b) => (b >= 1e6 ? `${(b / 1e6).toFixed(1).replace(".", ",")} MB` : `${Math.max(1, Math.round(b / 1e3))} KB`);
                E.form = { ...lerForm(), anexos: [...e.target.files].map((f) => ({ nome: f.name, tamanho: tamanho(f.size) })) };
                document.getElementById("anexos-lista").textContent = E.form.anexos.map((a) => a.nome).join(" · ");
            });
        }
        if (E.tela === "ncs") {
            const b = document.getElementById("busca-ncs");
            b?.addEventListener("input", () => {
                E.termo = b.value;
                const pos = b.selectionStart;
                desenhar();
                const nb = document.getElementById("busca-ncs");
                nb.focus();
                nb.setSelectionRange(pos, pos);
            });
        }
    }

    // As ações (um ouvinte só)
    document.addEventListener("click", (e) => {
        const alvo = e.target.closest("[data-acao]");
        if (!alvo) return;
        if (alvo.classList.contains("veu") && e.target.closest("[data-parar]")) return;
        const { acao, id, tela } = alvo.dataset;
        switch (acao) {
            case "aba-app":
                trocarAba(tela);
                break;
            case "gaveta":
                E.gavetas[id] = !E.gavetas[id];
                desenhar();
                break;
            case "abrir-nc":
                if (!E.ncs[id]?.detalhe) return foraDoTeste();
                ir("nc", { ncId: id, aba: "resumo" });
                break;
            case "voltar":
                voltar();
                break;
            case "aba":
            case "ir-aba":
                E.aba = id;
                desenhar();
                if (acao === "ir-aba") window.scrollTo(0, 0);
                break;
            case "grupo": {
                const nc = E.ncs[E.ncId];
                const g = nc.itens.find((x) => `${nc.codigo}:${x.tipo}` === id);
                const atual = E.grupos[id] ?? g.lista.some((it) => it.estado !== "Fechada");
                E.grupos[id] = !atual;
                desenhar();
                break;
            }
            case "filtro":
                E.filtro = id;
                desenhar();
                break;
            case "nova":
                ir("nova", { form: { data: "2026-10-26" }, erros: {}, erroGeral: "" });
                break;
            case "continuar":
                ir("nova", { form: { ...E.rascunho, deRascunho: true }, erros: {}, erroGeral: "" });
                break;
            case "fechar-nova": {
                const f = lerForm();
                if (temConteudo(f)) {
                    E.form = f;
                    E.folha = { tipo: "sair" };
                    desenhar();
                } else voltar();
                break;
            }
            case "salvar-rascunho": {
                const f = E.tela === "nova" && document.getElementById("form-nova") ? lerForm() : E.form;
                E.rascunho = { ...f };
                delete E.rascunho.deRascunho;
                Object.assign(E, { form: null, erros: {}, folha: null });
                E.historico = [];
                E.gavetas.rascunhos = true;
                Object.assign(E, { tela: "pendencias" });
                desenhar(true);
                avisar("Rascunho salvo. Ele está nas suas pendências.");
                break;
            }
            case "descartar":
                // num rascunho que já existia, descarta só o que mudou agora; o rascunho fica
                Object.assign(E, { form: null, erros: {}, folha: null });
                voltar();
                avisar("Descartado.", "info");
                break;
            case "publicar":
                publicar();
                break;
            case "bloqueado":
                avisar("Ainda não dá para enviar: faltam itens do checklist de fechamento (aba Resumo).", "info");
                break;
            case "aprovar":
                aprovar();
                break;
            case "reprovar":
                abrirReprovar();
                break;
            case "confirmar-reprovar":
                reprovar();
                break;
            case "fechar-folha":
                if (E.folha?.tipo === "reprovar") E.folha.motivo = document.getElementById("motivo")?.value || "";
                E.folha = null;
                desenhar();
                break;
            case "sugestao":
                escolherSugestao(Number(id));
                break;
            case "recomecar":
                E = estadoInicial();
                desenhar(true);
                avisar("Pronto: o protótipo voltou ao começo.");
                break;
            default:
                foraDoTeste();
        }
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && E.folha) {
            E.folha = null;
            desenhar();
        }
    });

    desenhar();
</script>
