services:
  postgres:
    image: postgres:17-alpine
    container_name: qualityhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualityhub
      POSTGRES_PASSWORD: qualityhub_dev
      POSTGRES_DB: qualityhub
    ports:
      # Só a própria máquina conecta: sem isso, a porta abre para a rede da empresa (auditoria L7)
      - "127.0.0.1:5432:5432"
    volumes:
      - qualityhub-data:/var/lib/postgresql/data

volumes:
  qualityhub-data: